<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Pac City</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#0b0d12;
    font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;color:#111}
  #map{position:absolute;inset:0;touch-action:none}

  #panel{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));
    max-width:360px;margin:0 auto;background:#fff;border-radius:16px;padding:16px;
    box-shadow:0 12px 40px #0007;z-index:6;
    max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #panel-head{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
  #panel-head h1{margin:0 0 2px;font-size:20px}
  #panel-head .sub{margin:0 0 12px;color:#666;font-size:13px}
  #panel-toggle{flex:0 0 auto;width:36px;height:36px;min-height:0;padding:0;font-size:15px;line-height:1;
    background:#f0f0f0;border:1px solid #ddd;border-radius:999px}
  #panel.collapsed #panel-body,#panel.collapsed #panel-foot{display:none}
  #panel.collapsed{padding-bottom:12px}
  #panel label{display:block;font-size:12px;color:#555;margin:0 0 8px}
  #panel input{width:100%;margin-top:4px;padding:11px;border:1px solid #cfcfcf;border-radius:9px;font-size:16px}
  .row{display:flex;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:1px solid #cfcfcf;background:#f6f6f6;
    padding:12px;min-height:46px;border-radius:9px;color:#111}
  button.primary{width:100%;background:#ffe14d;border-color:#e6c400;font-weight:700;margin-top:4px}
  button:active{transform:translateY(1px)}
  #status{font-size:12.5px;color:#555;min-height:32px;margin:6px 0}
  #panel small{display:block;color:#8a8a8a;font-size:11px;margin-top:10px;line-height:1.4}

  .charlabel{font-size:12px;color:#555;margin:2px 0 4px}
  .chars{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
  .char{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:#fff;border:2px solid #e2e2e2;border-radius:12px;padding:6px 10px;min-height:0}
  .char.sel{border-color:#ffcf00;background:#fffbe6}
  .char svg{width:30px;height:30px;display:block}
  .char span{font-size:10px;color:#555;white-space:nowrap}
  .diff{flex:0 0 auto;background:#fff;border:2px solid #e2e2e2;border-radius:12px;padding:10px 12px;
    font-size:12px;color:#333;min-height:0}
  .diff.sel{border-color:#ffcf00;background:#fffbe6;font-weight:700}

#hud{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100vw - 24px)}
  #score{background:#000000aa;color:#ffe14d;font-weight:800;padding:9px 14px;border-radius:999px;
    box-shadow:0 4px 16px #0006}
  #lives{background:#000000aa;color:#ff8ad8;font-weight:800;padding:9px 14px;border-radius:999px;
    box-shadow:0 4px 16px #0006}
  #menu{background:#000000aa;color:#fff;border:none;min-height:0;padding:10px 14px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  #stick{position:absolute;right:calc(16px + env(safe-area-inset-right));
    bottom:calc(20px + env(safe-area-inset-bottom));z-index:4;opacity:.92;touch-action:none}
  #stick-base{width:148px;height:148px;border-radius:50%;background:#ffffff1c;
    border:2px solid #ffffff33;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
  #stick-base::after{content:"";position:absolute;inset:24px;border-radius:50%;border:1px dashed #ffffff22}
  #stick-knob{width:62px;height:62px;border-radius:50%;background:#ffffff55;border:2px solid #ffffff88;
    box-shadow:0 4px 14px #0006;will-change:transform;touch-action:none}

  .pac-marker{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 1px 2px #0009)}
  .pac-rot{will-change:transform;display:flex}

  #leveldone{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    padding:20px;background:#00000055;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #leveldone .card{background:#fff;border-radius:18px;padding:22px 20px;width:min(340px,90vw);
    text-align:center;box-shadow:0 20px 50px #0009}
  #leveldone h2{margin:0 0 6px;font-size:22px}
  #leveldone p{margin:0 0 16px;color:#666;font-size:13px}
  #leveldone button{width:100%;margin-top:8px}

  /* Phones: turn the card into a bottom sheet so the map (and level preview) stays visible. */
  @media (max-width:640px){
    #panel{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));
      max-width:560px;border-radius:18px;max-height:64dvh}
    #hud{top:calc(10px + env(safe-area-inset-top))}
    #stick-base{width:132px;height:132px}
    #stick-knob{width:56px;height:56px}
  }
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="panel-head">
    <div>
      <h1>Pac City</h1>
      <p class="sub">Pac-Man over real city streets.</p>
    </div>
    <button id="panel-toggle" title="Show or hide the search options" aria-label="Show or hide search options">&#9662;</button>
  </div>
  <div id="panel-body">
    <label>City or address
      <input id="search" type="text" placeholder="e.g. Greenwich Village, NYC" autocomplete="off">
    </label>
    <div class="row">
      <button id="go">Search</button>
      <button id="loc">Use my location</button>
    </div>
    <div class="charlabel">Character</div>
    <div id="chars" class="chars"></div>
    <div class="charlabel">Ghosts</div>
    <div id="diffs" class="chars"></div>
  </div>
  <p id="status">Find a city, aim the map, then start.</p>
  <button id="start" class="primary">Start game here</button>
  <div id="panel-foot">
    <small>The dashed box shows the level area. Pan the map to move it.
      Roads &copy; OpenStreetMap contributors &middot; tiles by OpenFreeMap / OpenMapTiles. Geocoding via Nominatim.</small>
  </div>
</div>

<div id="hud" hidden>
  <div id="score">Dots: 0</div>
  <div id="lives" hidden>Lives 3</div>
  <button id="menu">Menu</button>
</div>

<div id="stick" hidden>
  <div id="stick-base"><div id="stick-knob"></div></div>
</div>

<div id="leveldone" hidden>
  <div class="card">
    <h2 id="ld-title">Level cleared!</h2>
    <p id="ld-stats"></p>
    <button id="ld-next" class="primary">Next level</button>
    <button id="ld-menu">Back to menu</button>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const MOUTH_VALUES =
  'M0,0 L1,-0.02 A1,1 0 1 0 1,0.02 Z;' +
  'M0,0 L0.62,-0.78 A1,1 0 1 0 0.62,0.78 Z;' +
  'M0,0 L1,-0.02 A1,1 0 1 0 1,0.02 Z';
// Lipstick follows the mouth edges: a red "<" that opens and closes with it.
const LIP_VALUES =
  'M0,0 L1,-0.02 M0,0 L1,0.02;' +
  'M0,0 L0.62,-0.78 M0,0 L0.62,0.78;' +
  'M0,0 L1,-0.02 M0,0 L1,0.02';
const MS_LIPS_OPEN = '<path d="M0,0 L0.62,-0.78 M0,0 L0.62,0.78" stroke="#e23b3b" stroke-width="0.09" fill="none" stroke-linecap="round"/>';
const MS_LIPS_ANIM = '<path stroke="#e23b3b" stroke-width="0.09" fill="none" stroke-linecap="round">' +
  '<animate attributeName="d" dur="0.3s" repeatCount="indefinite" calcMode="linear" values="'+LIP_VALUES+'"/></path>';
// Everything Ms. Pac-Man wears on top of her body: eye + lashes, a beauty spot
// on the cheek, and a red hair-bow.
const MS_PARTS =
  '<circle cx="0.26" cy="-0.55" r="0.12" fill="#1a1a1a"/>' +
  '<path d="M0.14,-0.70 L0.04,-0.86 M0.36,-0.68 L0.42,-0.86" stroke="#1a1a1a" stroke-width="0.07" fill="none" stroke-linecap="round"/>' +
  '<circle cx="0.36" cy="0.58" r="0.055" fill="#3a2a08"/>' +
  '<path d="M-0.02,-0.98 L-0.34,-1.12 L-0.26,-0.82 Z" fill="#e23b3b"/>' +
  '<path d="M-0.02,-0.98 L0.30,-1.12 L0.22,-0.82 Z" fill="#e23b3b"/>' +
  '<circle cx="-0.02" cy="-0.98" r="0.09" fill="#c62f2f"/>';

const CHARACTERS = [
  { id:'pacman',   name:'Pac-Man',     kind:'pac',   body:'#ffe14d', stroke:'#caa400',
    decoStatic:'', decoAnimated:'' },
  { id:'mspacman', name:'Ms. Pac-Man', kind:'pac',   body:'#ffd93b', stroke:'#cf9d00',
    decoStatic: MS_LIPS_OPEN + MS_PARTS, decoAnimated: MS_LIPS_ANIM + MS_PARTS },
  { id:'boo',      name:'Boo',         kind:'ghost', body:'#7fe0a2', stroke:'#37a35f', pupil:'#233b6b',
    rotate:false },
  { id:'dottie',   name:'Dottie',      kind:'pellet',body:'#ffffff', stroke:'#9db9de', pupil:'#26415c',
    rotate:false },
  { id:'chester',  name:'Chester',     kind:'chest', body:'#8a5a2b', stroke:'#5c3a17',
    rotate:false }
];
let chosenChar = 'pacman';
function characterById(id){ return CHARACTERS.find(c => c.id === id) || CHARACTERS[0]; }

function pacSVG(ch, preview){
  const body = preview
    ? '<path fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.05" d="M0,0 L0.62,-0.78 A1,1 0 1 0 0.62,0.78 Z"/>'
    : '<path fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.05">' +
      '<animate attributeName="d" dur="0.3s" repeatCount="indefinite" calcMode="linear" values="'+MOUTH_VALUES+'"/></path>';
  return '<svg viewBox="-1.2 -1.35 2.4 2.6" width="30" height="30">' + body +
    (preview ? ch.decoStatic : ch.decoAnimated) + '</svg>';
}

// A ghost in the classic four-ghost style: domed head, scalloped skirt, big
// white eyes whose pupils look the way it's heading. Drawn upright (never
// rotated) with the same gentle bob the arcade ghosts have. Boo is green to
// show he's on your side.
function ghostSVG(ch, preview){
  const content =
    '<path d="M-0.85,0.55 L-0.85,-0.15 A0.85,0.85 0 0 1 0.85,-0.15 L0.85,0.55 ' +
      'Q0.6375,0.30 0.425,0.55 Q0.2125,0.30 0,0.55 Q-0.2125,0.30 -0.425,0.55 Q-0.6375,0.30 -0.85,0.55 Z" ' +
      'fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.06" stroke-linejoin="round"/>' +
    '<ellipse cx="-0.32" cy="-0.35" rx="0.26" ry="0.32" fill="#ffffff"/>' +
    '<ellipse cx="0.32" cy="-0.35" rx="0.26" ry="0.32" fill="#ffffff"/>' +
    '<g class="pupil"><circle cx="-0.32" cy="-0.33" r="0.13" fill="'+ch.pupil+'"/></g>' +
    '<g class="pupil"><circle cx="0.32" cy="-0.33" r="0.13" fill="'+ch.pupil+'"/></g>';
  const wrap = preview ? content
    : '<g>' + content + '<animateTransform attributeName="transform" type="translate" values="0,0;0,-0.08;0,0" dur="0.9s" repeatCount="indefinite"/></g>';
  return '<svg viewBox="-1 -1.1 2 2" width="30" height="30">' + wrap + '</svg>';
}
// Dottie is a large power-pellet (white, like the dots) with one small eye,
// sitting where Pac-Man's eye sits. She softly pulses.
function pelletSVG(ch, preview){
  const aura = preview
    ? '<circle r="1.08" fill="#ffffff" opacity="0.18"/>'
    : '<circle r="1.08" fill="#ffffff" opacity="0.18">' +
      '<animate attributeName="r" values="1.02;1.16;1.02" dur="1.1s" repeatCount="indefinite"/>' +
      '<animate attributeName="opacity" values="0.24;0.10;0.24" dur="1.1s" repeatCount="indefinite"/></circle>';
  return '<svg viewBox="-1.3 -1.3 2.6 2.6" width="30" height="30">' + aura +
    '<circle r="0.95" fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.07"/>' +
    '<ellipse cx="-0.40" cy="-0.40" rx="0.22" ry="0.14" fill="#dce7f6"/>' +
    '<ellipse cx="0.26" cy="-0.55" rx="0.15" ry="0.18" fill="#ffffff" stroke="'+ch.stroke+'" stroke-width="0.035"/>' +
    '<circle cx="0.26" cy="-0.55" r="0.08" fill="'+ch.pupil+'"/>' +
    '</svg>';
}

// A treasure chest with two eyes: wooden body, domed lid, brass rim and lock.
function chestSVG(ch, preview){
  const lid = '#a06a34', brass = '#e0b23c', brassDark = '#a97d1e';
  const content =
    '<rect x="-0.80" y="-0.06" width="1.60" height="0.76" rx="0.06" fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.06"/>' +
    '<path d="M-0.80,-0.06 L-0.80,-0.30 A0.80,0.30 0 0 1 0.80,-0.30 L0.80,-0.06 Z" fill="'+lid+'" stroke="'+ch.stroke+'" stroke-width="0.06" stroke-linejoin="round"/>' +
    '<line x1="-0.78" y1="0.26" x2="0.78" y2="0.26" stroke="'+ch.stroke+'" stroke-width="0.04" opacity="0.45"/>' +
    '<line x1="-0.78" y1="0.52" x2="0.78" y2="0.52" stroke="'+ch.stroke+'" stroke-width="0.04" opacity="0.45"/>' +
    '<rect x="-0.84" y="-0.12" width="1.68" height="0.13" rx="0.03" fill="'+brass+'" stroke="'+brassDark+'" stroke-width="0.03"/>' +
    '<rect x="-0.15" y="0.00" width="0.30" height="0.32" rx="0.05" fill="'+brass+'" stroke="'+brassDark+'" stroke-width="0.04"/>' +
    '<circle cx="0" cy="0.12" r="0.05" fill="#3a2a08"/>' +
    '<path d="M-0.032,0.14 L0.032,0.14 L0.022,0.25 L-0.022,0.25 Z" fill="#3a2a08"/>' +
    '<ellipse cx="-0.30" cy="-0.38" rx="0.18" ry="0.20" fill="#ffffff"/>' +
    '<ellipse cx="0.30" cy="-0.38" rx="0.18" ry="0.20" fill="#ffffff"/>' +
    '<g class="pupil"><circle cx="-0.30" cy="-0.36" r="0.085" fill="#233b6b"/></g>' +
    '<g class="pupil"><circle cx="0.30" cy="-0.36" r="0.085" fill="#233b6b"/></g>' +
    '<ellipse cx="-0.36" cy="-0.50" rx="0.12" ry="0.06" fill="#ffffff" opacity="0.3"/>';
  return '<svg viewBox="-1 -1 2 2" width="30" height="30">' + content + '</svg>';
}

function characterSVG(ch, preview){
  if(ch.kind === 'ghost')  return ghostSVG(ch, preview);
  if(ch.kind === 'pellet') return pelletSVG(ch, preview);
  if(ch.kind === 'chest')  return chestSVG(ch, preview);
  return pacSVG(ch, preview);
}

const SPEED = 62;             // metres / second, at level 1
const SPEED_STEP = 0.12;      // each cleared level makes Pac-Man this much faster
const MAX_SPEED_MULT = 2.2;   // cap so later levels stay playable
function speedFactor(){ return Math.min(MAX_SPEED_MULT, 1 + (state.level - 1) * SPEED_STEP); }
const PELLET_SPACING = 25;    // minimum metres between dots (quiet rural roads)
const TARGET_DOTS = 240;      // roughly how many dots the whole board aims for
const MAX_SPACING_MULT = 2.8; // dense road systems may space dots out this much more
const DOT_MIN_SEP = 16;       // metres: thin dots that still bunch together
const EAT_RADIUS = 9;         // metres
const CELL = 24;              // spatial grid cell (metres)
const CATCH_RADIUS = 16;      // metres: a ghost this close to Pac-Man catches him
const LIVES = 3;              // Pac-Man's spare lives when ghosts are on
// Difficulty just decides how many ghosts roam and how fast they go. "Peaceful"
// is the original, ghost-free game.
const DIFFICULTIES = [
  { id:'peaceful', name:'Peaceful', ghosts:0, speed:0 },
  { id:'easy',     name:'Easy',     ghosts:1, speed:0.52 },
  { id:'normal',   name:'Normal',   ghosts:2, speed:0.64 },
  { id:'hard',     name:'Hard',     ghosts:4, speed:0.78 }
];
const GHOST_DEFS = [
  { name:'Blinky', body:'#ff5252', stroke:'#bd3a3a' },
  { name:'Pinky',  body:'#ff9fd6', stroke:'#cf6ba6' },
  { name:'Inky',   body:'#58e1ff', stroke:'#2f9fc0' },
  { name:'Clyde',  body:'#ffb852', stroke:'#cf8a25' }
];
let chosenDiff = 'peaceful';
function difficultyById(id){ return DIFFICULTIES.find(d => d.id === id) || DIFFICULTIES[0]; }
const CONTINUE_DOT = 0.25;    // cos(~75deg): auto-continue only through gentle bends
const TURN_BUFFER = 500;      // ms a tapped direction stays queued for the next node
const TURN_LOOKAHEAD = 12;    // metres: judge a road by where it goes, not its first kink
const PLAY_HALF = 350;        // half-size of play area (metres)
const MIN_STUB = 35;          // metres: dead-end stubs shorter than this are dropped
const MAX_PAIR = 220;         // metres: opposite-edge roads up to this far apart form a tunnel
const MERGE_DIST = 25;        // metres: dual carriageways closer than this merge into one
const PARALLEL_DOT = 0.97;    // cos(~14°): headings this close count as the same road
const PERP_MAX = 0.8;         // side-by-side: offset must be mostly perpendicular to the road
// Road data comes from the same vector tiles the basemap renders, so we never
// hit Overpass (or any third-party query service). OpenMapTiles has no
// "unclassified"/"residential" classes: those are grouped under "minor".
const ROAD_CLASSES = new Set(['trunk', 'primary', 'secondary', 'tertiary', 'minor']);
const ROAD_SOURCE = 'openmaptiles';
const ROAD_LAYER = 'transportation';
const TILE_WAIT = 15000;        // wait this long for basemap tiles to finish loading
const COORD_Q = 1e6;            // quantize lng/lat (~0.1 m) so ways stitch at shared nodes
const STITCH_DIST = 3;          // metres: a free road end this close to another road joins it
const DRV = { up:{x:0,y:1}, down:{x:0,y:-1}, left:{x:-1,y:0}, right:{x:1,y:0} };

// Roads are cached per play-area box and shared by concurrent requests, so
// panning around (prefetch) makes "Start" feel instant afterwards.
const roadCache = new Map();
const roadPending = new Map();
function bboxKey(bb){ return [bb.south,bb.west,bb.north,bb.east].map(v => v.toFixed(5)).join(','); }

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/dark',
  center: [-74.0, 40.73],
  zoom: 16,
  dragRotate: false,
  pitchWithRotate: false,
  keyboard: false,
  attributionControl: false
});
map.addControl(new maplibregl.AttributionControl({ compact:true, customAttribution:'Roads &copy; OpenStreetMap contributors &middot; tiles by OpenFreeMap' }), 'top-right');
map.touchZoomRotate.disableRotation();

const proj = { lng0:0, lat0:0, mlon:1, mlat:111320 };
function toXY(lng, lat){ return [ (lng-proj.lng0)*proj.mlon, (lat-proj.lat0)*proj.mlat ]; }
function toLngLat(x, y){ return [ proj.lng0 + x/proj.mlon, proj.lat0 + y/proj.mlat ]; }

const state = {
  running:false, loading:false, edges:[], adjSim:new Map(), pellets:[], grid:new Map(),
  pac:null, score:0, level:1, last:0, dirty:false, lastPellet:0, marker:null, rot:null, pupils:[],
  boundary:new Set(), wrapMap:new Map(),
  ghosts:[], nodePos:new Map(), difficulty:'peaceful', lives:LIVES, invuln:0,
  ghostMode:'scatter', ghostModeTimer:4, overlayMode:'level',
  powerPellets:[], points:0, frightTimer:0, frightCombo:0
};
let keyHeld = null;       // { x, y } from keyboard
let stick = null;         // { x, y } from the analog joystick
let swipe = null;         // { x, y, t } from a swipe gesture
let turnBuf = null;       // { x, y, t }: a tapped direction queued for the next node

// ---------- roads from the basemap tiles ----------
function roadKey(lng, lat){
  return Math.round(lng * COORD_Q) + ',' + Math.round(lat * COORD_Q);
}

// Resolve once the map has finished loading tiles for the current view (or
// after a timeout, so a slow tile server can't hang Start forever).
function waitForTiles(){
  return new Promise(resolve => {
    let done = false;
    const finish = () => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      map.off('idle', finish);
      resolve();
    };
    const timer = setTimeout(finish, TILE_WAIT);
    const ready = () => (typeof map.loaded !== 'function' || map.loaded()) &&
      (typeof map.areTilesLoaded !== 'function' || map.areTilesLoaded());
    if(ready()) return finish();
    map.on('idle', finish);
  });
}

// Which vector source/layer in the current style holds the roads. Normally the
// OpenFreeMap defaults, but read from the style so a style change doesn't break
// the game.
function roadSourceInfo(){
  try{
    const style = map.getStyle && map.getStyle();
    if(style){
      for(const id of Object.keys(style.sources || {})){
        const src = style.sources[id];
        if(!src || src.type !== 'vector') continue;
        for(const l of style.layers || []){
          if(l.source === id && l['source-layer'] === ROAD_LAYER) return { source:id };
        }
      }
    }
  }catch(e){ /* fall back to the defaults */ }
  return { source: ROAD_SOURCE };
}

// Turn the basemap's road LineStrings into the node/way shape buildGraph wants.
// Tiles are clipped per feature, but shared intersections keep identical
// coordinates, so keying synthetic nodes by position stitches the ways back
// together.
function collectRoads(){
  const elements = [];
  const points = new Map();
  const seen = new Set();
  let id = 0;
  const source = roadSourceInfo().source;
  const features = map.querySourceFeatures(source, { sourceLayer: ROAD_LAYER });
  for(const f of features){
    const cls = f.properties && f.properties.class;
    if(!ROAD_CLASSES.has(cls) || !f.geometry) continue;
    const parts = f.geometry.type === 'LineString' ? [f.geometry.coordinates]
      : f.geometry.type === 'MultiLineString' ? f.geometry.coordinates : [];
    for(const part of parts){
      const nodes = [];
      for(const pos of part){
        if(!Array.isArray(pos) || pos.length < 2) continue;
        const k = roadKey(pos[0], pos[1]);
        if(nodes.length && nodes[nodes.length-1] === k) continue;
        nodes.push(k);
        if(!points.has(k)) points.set(k, [pos[0], pos[1]]);
      }
      if(nodes.length < 2) continue;
      const sig = nodes.join('|');
      if(seen.has(sig)) continue;                    // tile buffers duplicate features
      seen.add(sig);
      const tags = { highway: cls };
      if(f.properties.brunnel) tags.brunnel = f.properties.brunnel;
      if(f.properties.layer !== undefined && f.properties.layer !== null) tags.layer = f.properties.layer;
      elements.push({ type:'way', id:id++, nodes, tags });
    }
  }
  for(const [k, pos] of points) elements.push({ type:'node', id:k, lon:pos[0], lat:pos[1] });
  return { elements };
}

// Tiles simplify every road on its own, so a way can end a few decimetres short
// of the road it meets. Left alone those gaps become dead ends (and stray
// portals), so snap each free end onto the nearest road, splitting that road
// where the join lands.
function stitchWays(osm, bb){
  const inBox = (lng, lat) =>
    lng >= bb.west && lng <= bb.east && lat >= bb.south && lat <= bb.north;
  const nodeEls = new Map();
  for(const el of osm.elements) if(el.type === 'node') nodeEls.set(el.id, el);
  const ways = osm.elements
    .filter(e => e.type === 'way' && e.nodes.length > 1)
    .filter(w => w.nodes.some(n => {
      const el = nodeEls.get(n);
      return el && inBox(el.lon, el.lat);
    }));
  if(!ways.length) return osm;
  const xyCache = new Map();
  const posOf = key => {
    if(xyCache.has(key)) return xyCache.get(key);
    const el = nodeEls.get(key);
    const p = el ? toXY(el.lon, el.lat) : null;
    xyCache.set(key, p);
    return p;
  };

  // A couple of passes: snapping one end can bring another road end within
  // reach, so re-scan after each round.
  for(let pass=0; pass<3; pass++){
    // Find free ends from the road geometry, not from how many ways use a node.
    // Two duplicate/tile-split ways can both end at the same node, and a road
    // split across two features shares a node in the middle: counting uses
    // would mistake those for through nodes. A real free end has no pair of
    // incident headings pointing in opposite directions.
    const dirAt = new Map();
    const addDir = (n, dx, dy) => {
      const L = Math.hypot(dx, dy); if(L < 1e-6) return;
      if(!dirAt.has(n)) dirAt.set(n, []);
      dirAt.get(n).push({ x:dx/L, y:dy/L });
    };
    for(const w of ways){
      for(let i=0; i+1<w.nodes.length; i++){
        const A = posOf(w.nodes[i]), B = posOf(w.nodes[i+1]);
        if(!A || !B) continue;
        addDir(w.nodes[i], B[0]-A[0], B[1]-A[1]);
        addDir(w.nodes[i+1], A[0]-B[0], A[1]-B[1]);
      }
    }
    const isFreeEnd = id => {
      const ds = dirAt.get(id);
      if(!ds || !ds.length) return false;
      for(let i=0; i<ds.length; i++) for(let j=i+1; j<ds.length; j++){
        if(ds[i].x*ds[j].x + ds[i].y*ds[j].y < -0.6) return false;
      }
      return true;
    };

    const leaves = [];
    for(const w of ways){
      const a = w.nodes[0], b = w.nodes[w.nodes.length-1];
      if(isFreeEnd(a)) leaves.push({ w, at:0, p:posOf(a) });
      if(b !== a && isFreeEnd(b)) leaves.push({ w, at:w.nodes.length-1, p:posOf(b) });
    }
    if(!leaves.length) break;

    // Bucket every segment into a small grid so each free end only looks at the
    // roads right next to it.
    const CELL = 8;
    const grid = new Map();
    for(const other of ways){
      for(let k=0; k+1<other.nodes.length; k++){
        const A = posOf(other.nodes[k]), B = posOf(other.nodes[k+1]);
        if(!A || !B) continue;
        const x0 = Math.floor(Math.min(A[0],B[0])/CELL), x1 = Math.floor(Math.max(A[0],B[0])/CELL);
        const y0 = Math.floor(Math.min(A[1],B[1])/CELL), y1 = Math.floor(Math.max(A[1],B[1])/CELL);
        for(let cx=x0; cx<=x1; cx++) for(let cy=y0; cy<=y1; cy++){
          const bk = cx+','+cy;
          if(!grid.has(bk)) grid.set(bk, []);
          grid.get(bk).push({ other, k, A, B });
        }
      }
    }

    const stitches = [], inserts = new Map();
    for(const leaf of leaves){
      if(!leaf.p) continue;
      const cx = Math.floor(leaf.p[0]/CELL), cy = Math.floor(leaf.p[1]/CELL);
      let best = null;
      const reach = Math.ceil(STITCH_DIST / CELL);
      for(let i=-reach;i<=reach;i++) for(let j=-reach;j<=reach;j++){
        const arr = grid.get((cx+i)+','+(cy+j));
        if(!arr) continue;
        for(const seg of arr){
          if(seg.other === leaf.w){
            // A road can loop back and end on itself; only skip the segment
            // that actually touches the free end, not the whole way.
            const adj = leaf.at === 0 ? 0 : seg.other.nodes.length - 2;
            if(seg.k === adj) continue;
          }
          const { A, B } = seg;
          const dx = B[0]-A[0], dy = B[1]-A[1];
          const L2 = dx*dx + dy*dy;
          let t = L2 ? ((leaf.p[0]-A[0])*dx + (leaf.p[1]-A[1])*dy)/L2 : 0;
          if(t < 0) t = 0; else if(t > 1) t = 1;
          const qx = A[0]+dx*t, qy = A[1]+dy*t;
          const d = Math.hypot(leaf.p[0]-qx, leaf.p[1]-qy);
          if(d <= STITCH_DIST && (!best || d < best.d)) best = { other:seg.other, k:seg.k, t, qx, qy, d };
        }
      }
      if(!best) continue;
      let targetKey;
      if(best.t < 0.02) targetKey = best.other.nodes[best.k];
      else if(best.t > 0.98) targetKey = best.other.nodes[best.k+1];
      else {
        const ll = toLngLat(best.qx, best.qy);
        targetKey = roadKey(ll[0], ll[1]);
        if(!nodeEls.has(targetKey)){
          const nodeEl = { type:'node', id:targetKey, lon:ll[0], lat:ll[1] };
          nodeEls.set(targetKey, nodeEl);
          osm.elements.push(nodeEl);
          xyCache.set(targetKey, [best.qx, best.qy]);
        }
        if(!inserts.has(best.other)) inserts.set(best.other, []);
        inserts.get(best.other).push({ k:best.k, t:best.t, key:targetKey });
      }
      stitches.push({ leaf, targetKey });
    }
    if(!stitches.length) break;

    // Splice the new join points in from the far end of each way backwards, so
    // earlier insertions don't shift the indices still to process.
    for(const [way, list] of inserts){
      list.sort((a,b) => b.k - a.k || b.t - a.t);
      for(const it of list){
        if(!way.nodes.includes(it.key)) way.nodes.splice(it.k+1, 0, it.key);
      }
    }
    for(const { leaf, targetKey } of stitches) leaf.w.nodes[leaf.at] = targetKey;
  }
  return osm;
}

// Vector tiles carry no OSM node ids. An intersection that shared one node in
// OSM can arrive as two unrelated ways whose segments simply cross: neither end
// is a dead end, so stitchWays cannot see it. Split both ways at every at-grade
// crossing so they share a node, the way the original map did. Bridges, tunnels
// and roads on different layers are left alone.
function nodeCrossings(osm, bb){
  const inBox = (lng, lat) =>
    lng >= bb.west && lng <= bb.east && lat >= bb.south && lat <= bb.north;
  const nodeEls = new Map();
  for(const el of osm.elements) if(el.type === 'node') nodeEls.set(el.id, el);
  const ways = osm.elements
    .filter(e => e.type === 'way' && e.nodes.length > 1)
    .filter(w => w.nodes.some(n => {
      const el = nodeEls.get(n);
      return el && inBox(el.lon, el.lat);
    }));
  if(!ways.length) return osm;
  const xyCache = new Map();
  const posOf = key => {
    if(xyCache.has(key)) return xyCache.get(key);
    const el = nodeEls.get(key);
    const p = el ? toXY(el.lon, el.lat) : null;
    xyCache.set(key, p);
    return p;
  };
  const layerOf = w => Number(w.tags && w.tags.layer) || 0;
  const atGrade = w => !(w.tags && w.tags.brunnel);

  const segs = [];
  ways.forEach((w, wi) => {
    for(let k=0; k+1<w.nodes.length; k++){
      const A = posOf(w.nodes[k]), B = posOf(w.nodes[k+1]);
      if(!A || !B) continue;
      segs.push({ wi, k, A, B, a:w.nodes[k], b:w.nodes[k+1] });
    }
  });

  const CELL = 24;
  const grid = new Map();
  for(let si=0; si<segs.length; si++){
    const s = segs[si];
    const x0 = Math.floor(Math.min(s.A[0],s.B[0])/CELL), x1 = Math.floor(Math.max(s.A[0],s.B[0])/CELL);
    const y0 = Math.floor(Math.min(s.A[1],s.B[1])/CELL), y1 = Math.floor(Math.max(s.A[1],s.B[1])/CELL);
    for(let cx=x0; cx<=x1; cx++) for(let cy=y0; cy<=y1; cy++){
      const bk = cx+','+cy;
      if(!grid.has(bk)) grid.set(bk, []);
      grid.get(bk).push(si);
    }
  }

  const seen = new Set(), inserts = new Map();
  const ensureNode = (x, y) => {
    const ll = toLngLat(x, y);
    const key = roadKey(ll[0], ll[1]);
    if(!nodeEls.has(key)){
      const el = { type:'node', id:key, lon:ll[0], lat:ll[1] };
      nodeEls.set(key, el);
      osm.elements.push(el);
    }
    return key;
  };
  const addInsert = (w, k, t, key) => {
    if(w.nodes[k] === key || w.nodes[k+1] === key) return;
    if(!inserts.has(w)) inserts.set(w, []);
    inserts.get(w).push({ k, t, key });
  };

  for(const arr of grid.values()){
    for(let i=0; i<arr.length; i++) for(let j=i+1; j<arr.length; j++){
      const ia = arr[i], ib = arr[j];
      const pk = ia < ib ? ia+'_'+ib : ib+'_'+ia;
      if(seen.has(pk)) continue;
      seen.add(pk);
      const s = segs[ia], t = segs[ib];
      if(s.wi === t.wi) continue;
      const ws = ways[s.wi], wt = ways[t.wi];
      if(!atGrade(ws) || !atGrade(wt)) continue;
      if(layerOf(ws) !== layerOf(wt)) continue;
      if(s.a === t.a || s.a === t.b || s.b === t.a || s.b === t.b) continue;
      const rx = s.B[0]-s.A[0], ry = s.B[1]-s.A[1];
      const ux = t.B[0]-t.A[0], uy = t.B[1]-t.A[1];
      const den = rx*uy - ry*ux;
      if(Math.abs(den) < 1e-9) continue;
      const qx = t.A[0]-s.A[0], qy = t.A[1]-s.A[1];
      const st = (qx*uy - qy*ux) / den;
      const tu = (qx*ry - qy*rx) / den;
      // Endpoint contacts are handled by stitchWays (free ends) or are already
      // shared nodes; only split genuine mid-segment crossings.
      if(st <= 0.02 || st >= 0.98 || tu <= 0.02 || tu >= 0.98) continue;
      const x = s.A[0]+rx*st, y = s.A[1]+ry*st;
      const ll = toLngLat(x, y);
      if(!inBox(ll[0], ll[1])) continue;
      const key = ensureNode(x, y);
      addInsert(ws, s.k, st, key);
      addInsert(wt, t.k, tu, key);
    }
  }

  for(const [w, list] of inserts){
    list.sort((a,b) => b.k - a.k || b.t - a.t);
    for(const it of list){
      if(!w.nodes.includes(it.key)) w.nodes.splice(it.k+1, 0, it.key);
    }
  }
  return osm;
}

// Safety net for the gaps stitching still misses: once the graph is built, any
// remaining free end that sits right next to another road gets a tiny connector.
// This catches duplicate/tile-split ways whose shared node made them look like
// through roads to stitchWays.
function weldLooseEnds(osm, bb, g){
  const inBox = (lng, lat) =>
    lng >= bb.west && lng <= bb.east && lat >= bb.south && lat <= bb.north;
  const nodeEls = new Map();
  for(const el of osm.elements) if(el.type === 'node') nodeEls.set(el.id, el);
  const ways = osm.elements
    .filter(e => e.type === 'way' && e.nodes.length > 1)
    .filter(w => w.nodes.some(n => {
      const el = nodeEls.get(n);
      return el && inBox(el.lon, el.lat);
    }));
  const posOf = key => {
    const el = nodeEls.get(key);
    return el ? toXY(el.lon, el.lat) : null;
  };

  const deg = new Map();
  for(const e of g.edges){
    deg.set(e.a, (deg.get(e.a)||0)+1);
    deg.set(e.b, (deg.get(e.b)||0)+1);
  }
  const leaves = [];
  for(const e of g.edges){
    if((deg.get(e.a)||0) === 1) leaves.push({ key:e.ids[0], edge:e });
    if((deg.get(e.b)||0) === 1) leaves.push({ key:e.ids[e.ids.length-1], edge:e });
  }
  if(!leaves.length) return 0;

  const CELL = 8;
  const grid = new Map();
  for(const w of ways){
    for(let k=0; k+1<w.nodes.length; k++){
      const A = posOf(w.nodes[k]), B = posOf(w.nodes[k+1]);
      if(!A || !B) continue;
      const x0 = Math.floor(Math.min(A[0],B[0])/CELL), x1 = Math.floor(Math.max(A[0],B[0])/CELL);
      const y0 = Math.floor(Math.min(A[1],B[1])/CELL), y1 = Math.floor(Math.max(A[1],B[1])/CELL);
      for(let cx=x0; cx<=x1; cx++) for(let cy=y0; cy<=y1; cy++){
        const bk = cx+','+cy;
        if(!grid.has(bk)) grid.set(bk, []);
        grid.get(bk).push({ w, k, A, B });
      }
    }
  }

  const inserts = new Map();
  let added = 0;
  const seen = new Set();
  const reach = Math.ceil(STITCH_DIST / CELL);
  for(const leaf of leaves){
    if(seen.has(leaf.key)) continue;
    seen.add(leaf.key);
    const p = posOf(leaf.key);
    if(!p) continue;
    const cx = Math.floor(p[0]/CELL), cy = Math.floor(p[1]/CELL);
    let best = null;
    for(let i=-reach; i<=reach; i++) for(let j=-reach; j<=reach; j++){
      const arr = grid.get((cx+i)+','+(cy+j));
      if(!arr) continue;
      for(const seg of arr){
        const w = seg.w, k = seg.k;
        if(w.nodes[k] === leaf.key || w.nodes[k+1] === leaf.key) continue;
        const A = seg.A, B = seg.B;
        const dx = B[0]-A[0], dy = B[1]-A[1];
        const L2 = dx*dx + dy*dy;
        let t = L2 ? ((p[0]-A[0])*dx + (p[1]-A[1])*dy)/L2 : 0;
        if(t < 0) t = 0; else if(t > 1) t = 1;
        const qx = A[0]+dx*t, qy = A[1]+dy*t;
        const d = Math.hypot(p[0]-qx, p[1]-qy);
        if(d <= STITCH_DIST && (!best || d < best.d)) best = { w, k, t, qx, qy, d };
      }
    }
    if(!best) continue;
    const bp = toLngLat(best.qx, best.qy);
    if(!inBox(bp[0], bp[1])) continue;
    let targetKey;
    if(best.t < 0.02) targetKey = best.w.nodes[best.k];
    else if(best.t > 0.98) targetKey = best.w.nodes[best.k+1];
    else {
      const ll = toLngLat(best.qx, best.qy);
      targetKey = roadKey(ll[0], ll[1]);
      if(!nodeEls.has(targetKey)){
        const el = { type:'node', id:targetKey, lon:ll[0], lat:ll[1] };
        nodeEls.set(targetKey, el);
        osm.elements.push(el);
      }
      if(!inserts.has(best.w)) inserts.set(best.w, []);
      inserts.get(best.w).push({ k:best.k, t:best.t, key:targetKey });
    }
    if(targetKey === leaf.key) continue;
    osm.elements.push({ type:'way', id:'weld'+added, nodes:[leaf.key, targetKey], tags:{ highway:'minor' } });
    added++;
  }

  for(const [w, list] of inserts){
    list.sort((a,b) => b.k - a.k || b.t - a.t);
    for(const it of list){
      if(!w.nodes.includes(it.key)) w.nodes.splice(it.k+1, 0, it.key);
    }
  }
  return added;
}

// Roads are cached per play-area box and shared by concurrent requests, so
// revisiting an area (prefetch) makes "Start" feel instant afterwards.
async function fetchRoads(bb){
  const key = bboxKey(bb);
  if(roadCache.has(key)) return roadCache.get(key);
  if(roadPending.has(key)) return roadPending.get(key);
  const p = (async () => {
    await waitForTiles();
    let data = collectRoads();
    if(!data.elements.length){
      // The source cache may not have caught up with a just-finished camera move.
      await new Promise(r => setTimeout(r, 300));
      data = collectRoads();
    }
    if(!data.elements.length) throw new Error('No road data here yet - try again in a second.');
    roadCache.set(key, data);
    if(roadCache.size > 8) roadCache.delete(roadCache.keys().next().value);
    return data;
  })();
  roadPending.set(key, p);
  p.then(() => roadPending.delete(key), () => roadPending.delete(key));
  return p;
}

// Raw OSM nodes are dense shape points; collapse chains of degree-2 nodes into
// single polyline edges so curves are followed smoothly and turns only happen
// at real intersections.
function buildGraph(osm, bb){
  const rawXY = new Map();
  for(const el of osm.elements){
    if(el.type === 'node') rawXY.set(el.id, toXY(el.lon, el.lat));
  }

  const ways = [];
  const nodeKeys = new Map();
  const rawNeighbors = new Set();
  const pk = (a,b) => (a < b ? a+'_'+b : b+'_'+a);
  for(const el of osm.elements){
    if(el.type !== 'way') continue;
    const t = el.tags || {};
    const rkey = String(t.name || t.ref || '').trim();
    ways.push({ nodes: el.nodes });
    if(rkey){
      for(const n of el.nodes){
        if(!nodeKeys.has(n)) nodeKeys.set(n, new Set());
        nodeKeys.get(n).add(rkey);
      }
    }
    for(let i=0; i+1<el.nodes.length; i++) rawNeighbors.add(pk(el.nodes[i], el.nodes[i+1]));
  }

  // Heading of the road at each raw node (unit vectors to its neighbours), used
  // to spot two roads running side by side.
  const dirs = new Map();
  const addDir = (n, dx, dy) => {
    const L = Math.hypot(dx, dy); if(L < 1e-6) return;
    if(!dirs.has(n)) dirs.set(n, []);
    dirs.get(n).push({ x:dx/L, y:dy/L });
  };
  for(const w of ways){
    for(let i=0; i+1<w.nodes.length; i++){
      const A = rawXY.get(w.nodes[i]), B = rawXY.get(w.nodes[i+1]);
      if(!A || !B) continue;
      addDir(w.nodes[i], B[0]-A[0], B[1]-A[1]);
      addDir(w.nodes[i+1], A[0]-B[0], A[1]-B[1]);
    }
  }

  // Union nearby nodes belonging to parallel one-way carriageways of the same
  // road, so divided roads / highways collapse to a single centreline.
  const parent = new Map();
  for(const id of rawXY.keys()) parent.set(id, id);
  const find = x => { let r = x; while(parent.get(r) !== r) r = parent.get(r); while(parent.get(x) !== r){ const nx = parent.get(x); parent.set(x, r); x = nx; } return r; };
  const union = (a,b) => { a = find(a); b = find(b); if(a !== b) parent.set(a, b); };

  // Two nearby nodes belong to the same road if they share a name/ref, or if
  // both are unnamed and their roads run near-collinear and side by side (the
  // connecting offset is mostly perpendicular to that heading). This keeps
  // genuinely different parallel streets apart while collapsing two lanes of a
  // single road — even when it carries no name or oneway tag.
  const sharesName = (a, b) => {
    const ka = nodeKeys.get(a), kb = nodeKeys.get(b);
    if(!ka || !kb) return false;
    for(const k of ka){ if(kb.has(k)) return true; }
    return false;
  };
  const bothUnnamed = (a, b) => !nodeKeys.has(a) && !nodeKeys.has(b);
  const sideBySide = (a, b, dx, dy, dist) => {
    const da = dirs.get(a), db = dirs.get(b);
    if(!da || !db || dist < 1e-3) return false;
    const ux = dx/dist, uy = dy/dist;
    for(const p of da) for(const q of db){
      if(p.x*q.x + p.y*q.y < PARALLEL_DOT) continue;   // headings run the same way
      if(Math.abs(ux*p.x + uy*p.y) < PERP_MAX) return true;  // offset lies across them
    }
    return false;
  };

  const cell = MERGE_DIST;
  const buckets = new Map();
  const bk = (x,y) => Math.floor(x/cell)+','+Math.floor(y/cell);
  for(const id of rawXY.keys()){
    const xy = rawXY.get(id);
    const k = bk(xy[0], xy[1]);
    if(!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(id);
  }
  for(const id of rawXY.keys()){
    const xy = rawXY.get(id);
    const cx = Math.floor(xy[0]/cell), cy = Math.floor(xy[1]/cell);
    for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
      const arr = buckets.get((cx+i)+','+(cy+j));
      if(!arr) continue;
      for(const id2 of arr){
        if(id2 <= id) continue;
        if(rawNeighbors.has(pk(id, id2))) continue;        // never merge points along the same way
        const xy2 = rawXY.get(id2);
        const dx = xy2[0]-xy[0], dy = xy2[1]-xy[1];
        const dist = Math.hypot(dx, dy);
        if(dist > cell) continue;
        if(sharesName(id, id2) || (bothUnnamed(id, id2) && sideBySide(id, id2, dx, dy, dist))) union(id, id2);
      }
    }
  }

  // Representative position of each cluster = centroid (the centreline).
  const sumX = new Map(), sumY = new Map(), cnt = new Map();
  for(const id of rawXY.keys()){
    const r = find(id), xy = rawXY.get(id);
    sumX.set(r, (sumX.get(r)||0)+xy[0]);
    sumY.set(r, (sumY.get(r)||0)+xy[1]);
    cnt.set(r, (cnt.get(r)||0)+1);
  }
  const nodes = new Map();
  for(const r of cnt.keys()) nodes.set(r, [ sumX.get(r)/cnt.get(r), sumY.get(r)/cnt.get(r) ]);
  const inBox = r => {
    const xy = nodes.get(r);
    if(!xy) return false;
    const lng = proj.lng0 + xy[0]/proj.mlon, lat = proj.lat0 + xy[1]/proj.mlat;
    return lng >= bb.west && lng <= bb.east && lat >= bb.south && lat <= bb.north;
  };

  const adj = new Map();
  const boundary = new Set();
  const link = (a,b) => { if(!adj.has(a)) adj.set(a,new Set()); adj.get(a).add(b); };
  for(const w of ways){
    let prev = null, prevInside = false;
    for(const n of w.nodes){
      if(!rawXY.has(n)) continue;
      const r = find(n);
      const inside = nodes.has(r) && inBox(r);
      if(prev !== null){
        if(prevInside && inside && r !== prev){ link(prev, r); link(r, prev); }
        else if(prevInside && !inside){ boundary.add(prev); }   // road runs past the edge
        else if(!prevInside && inside){ boundary.add(r); }
      }
      prev = r; prevInside = inside;
    }
  }
  const degree = id => (adj.get(id) ? adj.get(id).size : 0);
  const used = new Set();
  const key = (a,b) => a+'_'+b;
  const edges = [];

  const walk = (start, first) => {
    const ids = [start];
    const coords = [nodes.get(start)];
    let prev = start, cur = first, guard = 0;
    used.add(key(start,first)); used.add(key(first,start));
    while(guard++ < 200000){
      ids.push(cur); coords.push(nodes.get(cur));
      if(cur === start) break;
      if(degree(cur) !== 2) break;
      const nbrs = adj.get(cur);
      let next;
      for(const n of nbrs){ if(n !== prev){ next = n; break; } }
      if(next === undefined) break;
      used.add(key(cur,next)); used.add(key(next,cur));
      prev = cur; cur = next;
    }
    return { ids, coords };
  };

  const push = (ids, coords) => {
    if(ids.length < 2) return;
    const cum = [0];
    for(let i=1; i<coords.length; i++){
      cum.push(cum[i-1] + Math.hypot(coords[i][0]-coords[i-1][0], coords[i][1]-coords[i-1][1]));
    }
    edges.push({ a:ids[0], b:ids[ids.length-1], ids, coords, cum, length:cum[cum.length-1] });
  };

  for(const a of adj.keys()){
    if(degree(a) === 2) continue;
    for(const b of adj.get(a)){ if(used.has(key(a,b))) continue; const w = walk(a,b); push(w.ids,w.coords); }
  }
  for(const a of adj.keys()){
    if(degree(a) !== 2) continue;
    for(const b of adj.get(a)){ if(used.has(key(a,b))) continue; const w = walk(a,b); push(w.ids,w.coords); }
  }

  const adjSim = new Map();
  edges.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });

  return { edges, adjSim, boundary };
}

// Drop very short dead-end roads so Pac-Man isn't stopped by tiny spurs. Runs
// repeatedly, so a dead-end branch made of several short edges disappears too.
function pruneShortDeadEnds(minLen){
  const edges = state.edges;
  let changed = true, guard = 0;
  while(changed && guard++ < 500){
    changed = false;
    const deg = new Map();
    for(const e of edges){
      if(e.removed) continue;
      deg.set(e.a, (deg.get(e.a)||0)+1);
      deg.set(e.b, (deg.get(e.b)||0)+1);
    }
    for(const e of edges){
      if(e.removed || e.length >= minLen) continue;
      const deadA = (deg.get(e.a)||0) <= 1 && !state.wrapMap.has(e.a);
      const deadB = (deg.get(e.b)||0) <= 1 && !state.wrapMap.has(e.b);
      if(deadA || deadB){ e.removed = true; changed = true; }
    }
  }
  const kept = edges.filter(e => !e.removed);
  const adjSim = new Map();
  kept.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });
  state.edges = kept;
  state.adjSim = adjSim;
}

// A road too short to hold even one dot gives the player nothing to collect, so
// cut it. Runs before tunnel pairing so any dead-ends it creates get cleaned up.
function hasRoomForDot(e){ return e.length - 1 > PELLET_SPACING*0.5; }
function clipDotlessEdges(){
  const deg = new Map();
  for(const e of state.edges){
    deg.set(e.a, (deg.get(e.a)||0)+1);
    deg.set(e.b, (deg.get(e.b)||0)+1);
  }
  // Short connectors between intersections are part of the road network; only
  // cut dead-end spurs. Cutting a connector splits the road and invents two
  // portals in the middle of it.
  const kept = state.edges.filter(e => hasRoomForDot(e) ||
    ((deg.get(e.a)||0) > 1 && (deg.get(e.b)||0) > 1));
  if(kept.length === state.edges.length) return;
  const adjSim = new Map();
  kept.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });
  state.edges = kept;
  state.adjSim = adjSim;
}

// Give every remaining dead-end a portal by pairing it with its nearest other
// dead-end, so no road just stops at a wall. A lone leftover (or two ends of the
// same road) can't pair and gets cut by pruneShortDeadEnds(Infinity) afterwards.
function wrapDeadEnds(){
  const deg = new Map(), pos = new Map();
  const direct = new Set();
  const pk = (a,b) => a <= b ? a+'_'+b : b+'_'+a;
  for(const e of state.edges){
    deg.set(e.a, (deg.get(e.a)||0)+1);
    deg.set(e.b, (deg.get(e.b)||0)+1);
    if(!pos.has(e.a)) pos.set(e.a, e.coords[0]);
    if(!pos.has(e.b)) pos.set(e.b, e.coords[e.coords.length-1]);
    direct.add(pk(e.a, e.b));
  }
  const leaves = [];
  for(const [n,d] of deg){
    if(d === 1 && !state.wrapMap.has(n) && pos.has(n)) leaves.push(n);
  }
  const used = new Set();
  for(const a of leaves){
    if(used.has(a)) continue;
    const pa = pos.get(a);
    let best = null, bd = Infinity;
    for(const b of leaves){
      if(b === a || used.has(b) || direct.has(pk(a,b))) continue;
      const pb = pos.get(b);
      const d = Math.hypot(pa[0]-pb[0], pa[1]-pb[1]);
      if(d < bd){ bd = d; best = b; }
    }
    if(best !== null){
      state.wrapMap.set(a, { node:best });
      state.wrapMap.set(best, { node:a });
      used.add(a); used.add(best);
    }
  }
}

// Keep only the roads Pac-Man can actually reach from where he starts, so every
// dot is collectable. Tunnels count as connections between their two mouths.
function keepLargestComponent(){
  const adj = state.adjSim;
  const seen = new Set();
  const comps = [];
  const compOf = new Map();
  for(const start of adj.keys()){
    if(seen.has(start)) continue;
    const comp = { nodes:new Set(), len:0 };
    const stack = [start];
    seen.add(start);
    while(stack.length){
      const n = stack.pop();
      comp.nodes.add(n); compOf.set(n, comp);
      for(const c of (adj.get(n)||[])){
        const e = state.edges[c.edgeIndex];
        const nb = (e.a === n) ? e.b : e.a;
        if(!seen.has(nb)){ seen.add(nb); stack.push(nb); }
      }
      const w = state.wrapMap.get(n);
      if(w && !seen.has(w.node)){ seen.add(w.node); stack.push(w.node); }
    }
    comps.push(comp);
  }
  if(comps.length <= 1) return;
  for(const e of state.edges) compOf.get(e.a).len += e.length;
  let main = comps[0];
  for(const c of comps) if(c.len > main.len) main = c;
  state.edges = state.edges.filter(e => main.nodes.has(e.a) && main.nodes.has(e.b));
  const adjSim = new Map();
  state.edges.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });
  state.adjSim = adjSim;
}

// Drop tunnel links whose road ends were pruned, so a portal never points at a
// node that is no longer on the board.
function cleanWraps(){
  for(const [id, w] of state.wrapMap){
    if(!state.adjSim.has(id) || !state.adjSim.has(w.node)) state.wrapMap.delete(id);
  }
}

// Pair up roads that run past opposite edges of the play area so Pac-Man can
// drive off one side and reappear on the other, like a Pac-Man tunnel.
function buildWraps(bb){
  const xw = (bb.west - proj.lng0)*proj.mlon, xe = (bb.east - proj.lng0)*proj.mlon;
  const ys = (bb.south - proj.lat0)*proj.mlat, yn = (bb.north - proj.lat0)*proj.mlat;
  const deg = new Map();
  for(const e of state.edges){
    deg.set(e.a, (deg.get(e.a)||0)+1);
    deg.set(e.b, (deg.get(e.b)||0)+1);
  }
  const north = [], south = [], east = [], west = [];
  const seen = new Set();
  const consider = (id, pos) => {
    if(seen.has(id) || !state.boundary.has(id) || (deg.get(id)||0) !== 1) return;
    seen.add(id);
    const [x,y] = pos;
    const dn = yn - y, ds = y - ys, de = xe - x, dw = x - xw;
    const m = Math.min(dn, ds, de, dw);
    if(m === dn) north.push({ id, c:x });
    else if(m === ds) south.push({ id, c:x });
    else if(m === de) east.push({ id, c:y });
    else west.push({ id, c:y });
  };
  for(const e of state.edges){
    consider(e.a, e.coords[0]);
    consider(e.b, e.coords[e.coords.length-1]);
  }
  const wrapMap = new Map();
  const pair = (A, B) => {
    const used = new Set();
    for(const a of A){
      let best = null, bd = MAX_PAIR;
      for(const b of B){
        if(used.has(b.id)) continue;
        const d = Math.abs(a.c - b.c);
        if(d < bd){ bd = d; best = b; }
      }
      if(best){ used.add(best.id); wrapMap.set(a.id, { node:best.id }); wrapMap.set(best.id, { node:a.id }); }
    }
  };
  pair(north, south);
  pair(east, west);
  state.wrapMap = wrapMap;
}

// Edge leaving a node whose heading best matches dir (used when exiting a tunnel).
function pickEdgeClosestTo(nodeId, dir){
  const inc = state.adjSim.get(nodeId) || [];
  let best = null, bestDot = -Infinity;
  for(const c of inc){
    const h = headingFrom(nodeId, c.edgeIndex);
    const dot = h.x*dir.x + h.y*dir.y;
    if(dot > bestDot){ bestDot = dot; best = c; }
  }
  return best ? { edgeIndex:best.edgeIndex, forward:dirFor(best.edgeIndex, nodeId) } : null;
}

function pointAt(e, d){
  d = Math.max(0, Math.min(e.length, d));
  let lo = 0, hi = e.cum.length - 1;
  while(lo < hi - 1){ const mid = (lo + hi) >> 1; if(e.cum[mid] <= d) lo = mid; else hi = mid; }
  const span = (e.cum[hi] - e.cum[lo]) || 1;
  const t = (d - e.cum[lo]) / span;
  return [
    e.coords[lo][0] + (e.coords[hi][0] - e.coords[lo][0]) * t,
    e.coords[lo][1] + (e.coords[hi][1] - e.coords[lo][1]) * t,
    lo
  ];
}

function headingFrom(nodeId, edgeIndex, look){
  const e = state.edges[edgeIndex];
  let startIdx, step;
  if(e.a === nodeId && e.b !== nodeId){ startIdx = 0; step = 1; }
  else if(e.b === nodeId && e.a !== nodeId){ startIdx = e.coords.length - 1; step = -1; }
  else { startIdx = 0; step = 1; }
  const p0 = e.coords[startIdx];
  let p1 = p0, acc = 0;
  for(let i = startIdx + step; i >= 0 && i < e.coords.length; i += step){
    const d = Math.hypot(e.coords[i][0]-p0[0], e.coords[i][1]-p0[1]);
    if(d <= 0.01) continue;
    p1 = e.coords[i];
    acc = d;
    if(acc >= (look || 0)) break;
  }
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  const L = Math.hypot(dx,dy) || 1;
  return { x:dx/L, y:dy/L };
}

function norm(x,y){ const L = Math.hypot(x,y) || 1; return { x:x/L, y:y/L }; }

function dirFor(edgeIndex, nodeId){
  return state.edges[edgeIndex].a === nodeId;
}

function rememberTurn(v, ms){
  if(!v) return;
  turnBuf = { x:v.x, y:v.y, t:performance.now() + (ms || TURN_BUFFER) };
}

function desiredVec(){
  if(stick) return stick;
  if(keyHeld) return keyHeld;
  const now = performance.now();
  if(swipe && now < swipe.t) return { x:swipe.x, y:swipe.y };
  if(turnBuf && now < turnBuf.t) return { x:turnBuf.x, y:turnBuf.y };
  return null;
}

// Direction Pac-Man is currently travelling (used for instant U-turns).
function travelHeading(){
  const e = state.edges[state.pac.edgeIndex];
  const seg = pointAt(e, state.pac.dist)[2];
  const p0 = e.coords[seg], p1 = e.coords[seg+1] || e.coords[seg];
  let dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  if(!state.pac.forward){ dx = -dx; dy = -dy; }
  return norm(dx,dy);
}

// Direction of travel on the edge we arrived along, right at that node.
function arrivalHeadingAt(cameIndex, nodeId){
  const e = state.edges[cameIndex];
  if(e.b === nodeId){
    const n = e.coords.length;
    const a = e.coords[n-2] || e.coords[n-1], b = e.coords[n-1];
    return norm(b[0]-a[0], b[1]-a[1]);
  }
  const a = e.coords[1] || e.coords[0], b = e.coords[0];
  return norm(b[0]-a[0], b[1]-a[1]);
}

// Pick the next edge at a node. Returns null when Pac-Man must stop (wall).
function chooseAtNode(nodeId, cameIndex){
  const cands = state.adjSim.get(nodeId) || [];
  if(!cands.length) return null;

  const arr = (cameIndex != null) ? arrivalHeadingAt(cameIndex, nodeId) : null;
  const desired = desiredVec();

  // Held direction: take whichever road is closest in angle. If the player is
  // pointing away from the road they came in on, prefer the turn over a near-tie
  // with the straight continuation (an analog stick often lands between two roads).
  if(desired){
    const wantsTurn = arr ? (arr.x*desired.x + arr.y*desired.y) < 0.8 : false;
    let best = null, bestScore = -Infinity, bestDot = -Infinity;
    for(const c of cands){
      const h = headingFrom(nodeId, c.edgeIndex, TURN_LOOKAHEAD);
      const dot = h.x*desired.x + h.y*desired.y;
      if(dot <= 0) continue;
      const align = arr ? (h.x*arr.x + h.y*arr.y) : 0;
      const score = dot + (wantsTurn && align > -0.5 ? 0.15 * (1 - align) : 0);
      if(score > bestScore + 1e-6 || (Math.abs(score - bestScore) <= 1e-6 && dot > bestDot)){
        best = c; bestScore = score; bestDot = dot;
      }
    }
    // Only ignore the held direction if every road here points against it.
    if(best) return { edgeIndex:best.edgeIndex, forward: dirFor(best.edgeIndex, nodeId) };
  }

  // No usable held direction: roll through gentle bends, otherwise stop.
  if(arr){
    let best = null, bestDot = -Infinity;
    for(const c of cands){
      const h = headingFrom(nodeId, c.edgeIndex, TURN_LOOKAHEAD);
      const dot = h.x*arr.x + h.y*arr.y;
      if(dot > bestDot){ bestDot = dot; best = c; }
    }
    if(bestDot >= CONTINUE_DOT) return { edgeIndex:best.edgeIndex, forward: dirFor(best.edgeIndex, nodeId) };
  }
  return null;
}

// ---------- pellets ----------
function cellKey(x,y){ return Math.floor(x/CELL)+','+Math.floor(y/CELL); }

// One spacing for the whole board, based on how much road there is. A dense
// downtown grid (Boston) gets wider spacing so it doesn't become a carpet of
// dots; a sparse rural network keeps the base spacing.
function dotSpacing(){
  let total = 0;
  for(const e of state.edges) total += e.length;
  const s = total / TARGET_DOTS;
  return Math.max(PELLET_SPACING, Math.min(PELLET_SPACING * MAX_SPACING_MULT, s));
}

// Greedily drop dots that sit too close to one already kept (parallel streets a
// few metres apart, duplicated carriageways). Keeps the closest one.
function thinDots(points){
  const cell = DOT_MIN_SEP;
  const grid = new Map();
  const out = [];
  for(const p of points){
    const cx = Math.floor(p.x/cell), cy = Math.floor(p.y/cell);
    let near = false;
    for(let a=-1;a<=1 && !near;a++) for(let b=-1;b<=1 && !near;b++){
      const arr = grid.get((cx+a) + ',' + (cy+b));
      if(!arr) continue;
      for(const q of arr){
        if(Math.hypot(q.x-p.x, q.y-p.y) < DOT_MIN_SEP){ near = true; break; }
      }
    }
    if(near) continue;
    out.push(p);
    const k = cx + ',' + cy;
    if(!grid.has(k)) grid.set(k, []);
    grid.get(k).push(p);
  }
  return out;
}

function placePellets(){
  const sp = dotSpacing();
  let all = [];
  for(const e of state.edges){
    for(let d = sp*0.5; d < e.length - 1; d += sp){
      const p = pointAt(e, d);
      all.push({ x:p[0], y:p[1] });
    }
  }
  all = thinDots(all);
  // Choose up to four power pellets spread across the play area, one per
  // quadrant, each placed on an existing dot so it sits on a road.
  const used = new Set();
  state.powerPellets = [];
  if(all.length >= 4){
    let cx = 0, cy = 0;
    for(const p of all){ cx += p.x; cy += p.y; }
    cx /= all.length; cy /= all.length;
    const quads = [[-1,-1],[1,-1],[1,1],[-1,1]];
    for(const [qx,qy] of quads){
      let best = -1, bestD = -Infinity;
      for(let i=0;i<all.length;i++){
        if(used.has(i)) continue;
        const dx = all[i].x - cx, dy = all[i].y - cy;
        if((dx >= 0 ? 1 : -1) !== qx || (dy >= 0 ? 1 : -1) !== qy) continue;
        const d = Math.hypot(dx, dy);
        if(d > bestD){ bestD = d; best = i; }
      }
      if(best >= 0){ used.add(best); state.powerPellets.push({ x:all[best].x, y:all[best].y, eaten:false }); }
    }
  }
  state.pellets = [];
  for(let i=0;i<all.length;i++){
    if(used.has(i)) continue;
    state.pellets.push({ x:all[i].x, y:all[i].y, eaten:false });
  }
  state.grid = new Map();
  state.pellets.forEach((p,i) => {
    const k = cellKey(p.x,p.y);
    if(!state.grid.has(k)) state.grid.set(k, []);
    state.grid.get(k).push(i);
  });
}

function dotsRemaining(){
  let n = 0;
  for(const p of state.pellets) if(!p.eaten) n++;
  for(const p of state.powerPellets) if(!p.eaten) n++;
  return n;
}

function eatAround(x,y){
  const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const arr = state.grid.get((cx+i)+','+(cy+j));
    if(!arr) continue;
    for(const idx of arr){
      const p = state.pellets[idx];
      if(p.eaten) continue;
      if(Math.hypot(p.x-x, p.y-y) <= EAT_RADIUS){ p.eaten = true; state.score++; state.points += 10; state.dirty = true; }
    }
  }
  // Few of them, so a plain scan is fine.
  for(const p of state.powerPellets){
    if(p.eaten) continue;
    if(Math.hypot(p.x-x, p.y-y) <= EAT_RADIUS){
      p.eaten = true; state.score++; state.points += 50;
      state.dirty = true; activateFright();
    }
  }
}

function spawnPac(){
  let e = null;
  for(let tries=0; tries<40 && !e; tries++){
    const c = state.edges[(Math.random()*state.edges.length)|0];
    if(c && c.length > PELLET_SPACING*3) e = c;
  }
  e = e || state.edges[0];
  const ei = state.edges.indexOf(e);
  state.pac = { edgeIndex:ei, dist: e.length*0.5, forward:true, waitNode:null };
}

function pacPos(){
  const e = state.edges[state.pac.edgeIndex];
  return pointAt(e, state.pac.dist);
}

// ---------- ghosts ----------
function ghostPos(gh){ return pointAt(state.edges[gh.edgeIndex], gh.dist); }

// Position of every graph node (endpoints of the polylines), for ghost targeting.
function buildNodePos(){
  const m = new Map();
  for(const e of state.edges){
    m.set(e.a, e.coords[0]);
    m.set(e.b, e.coords[e.coords.length-1]);
  }
  state.nodePos = m;
}

function addGhostMarker(gh){
  const el = document.createElement('div');
  el.className = 'pac-marker';
  el.innerHTML = '<div class="pac-rot">' + ghostSVG({ kind:'ghost', body:gh.body, stroke:gh.stroke, pupil:'#233b6b' }, false) + '</div>';
  gh.el = el;
  gh.skinKey = gh.body + '|' + gh.stroke + '|#233b6b';
  gh.pupils = el.querySelectorAll ? Array.from(el.querySelectorAll('.pupil')) : [];
  gh.marker = new maplibregl.Marker({ element: el, anchor:'center' }).setLngLat([0,0]).addTo(map);
}

function clearGhosts(){
  if(state.ghosts) for(const gh of state.ghosts){ if(gh.marker) gh.marker.remove(); }
  state.ghosts = [];
}

// Drop the ghosts on edges well away from Pac-Man's spawn.
function spawnGhosts(){
  clearGhosts();
  state.frightTimer = 0; state.frightCombo = 0;
  const diff = difficultyById(state.difficulty);
  if(!diff.ghosts || !state.edges.length || !state.pac) return;
  const p = pacPos();
  const far = state.edges
    .map((e, i) => ({ i, e }))
    .filter(x => { const m = pointAt(x.e, x.e.length/2); return Math.hypot(m[0]-p[0], m[1]-p[1]) > 120; });
  const pool = far.length ? far : state.edges.map((e,i) => ({ i, e }));
  const corners = state.bb ? [
    toXY(state.bb.west,  state.bb.north), toXY(state.bb.east, state.bb.north),
    toXY(state.bb.east,  state.bb.south), toXY(state.bb.west, state.bb.south)
  ] : [];
  for(let k=0; k<diff.ghosts; k++){
    const pick = pool[(Math.random()*pool.length)|0];
    const def = GHOST_DEFS[k % GHOST_DEFS.length];
    const gh = { edgeIndex:pick.i, dist:pick.e.length/2, forward:true, waitNode:null,
      name:def.name, body:def.body, stroke:def.stroke, corner:corners[k % corners.length] || p };
    state.ghosts.push(gh);
    addGhostMarker(gh);
  }
}

function ghostSpeed(){
  const diff = difficultyById(state.difficulty);
  if(!diff.ghosts) return 0;
  return SPEED * diff.speed * Math.min(1.5, 1 + (state.level-1)*0.05);
}

// A power pellet was eaten: ghosts turn blue and edible for a few seconds.
function activateFright(){
  state.frightTimer = Math.max(3, 9 - (state.level-1)*0.6);
  state.frightCombo = 0;
  for(const gh of state.ghosts) applyGhostSkin(gh);
}

const FRIGHT_BLUE = { body:'#2b2bd6', stroke:'#161699', pupil:'#c8caff' };
const FRIGHT_WHITE = { body:'#f2f2ff', stroke:'#b9b9e6', pupil:'#d94b4b' };

function ghostSkin(gh){
  if(state.frightTimer <= 0) return { body:gh.body, stroke:gh.stroke, pupil:'#233b6b' };
  const flash = state.frightTimer < 2 && (Math.floor(state.frightTimer*6) % 2 === 0);
  return flash ? FRIGHT_WHITE : FRIGHT_BLUE;
}

// Swap a ghost's sprite when it changes between normal, blue and flashing.
function applyGhostSkin(gh){
  const s = ghostSkin(gh);
  const key = s.body + '|' + s.stroke + '|' + s.pupil;
  if(gh.skinKey === key) return;
  gh.skinKey = key;
  if(!gh.el) return;
  gh.el.innerHTML = '<div class="pac-rot">' + ghostSVG({ kind:'ghost', body:s.body, stroke:s.stroke, pupil:s.pupil }, false) + '</div>';
  gh.pupils = gh.el.querySelectorAll ? Array.from(gh.el.querySelectorAll('.pupil')) : [];
}

// Drop one ghost far from Pac-Man (used when a frightened ghost is eaten).
function respawnOneGhost(gh){
  if(!state.edges.length) return;
  const p = pacPos();
  const far = state.edges
    .map((e, i) => ({ i, e }))
    .filter(x => { const m = pointAt(x.e, x.e.length/2); return Math.hypot(m[0]-p[0], m[1]-p[1]) > 120; });
  const pool = far.length ? far : state.edges.map((e,i) => ({ i, e }));
  const pick = pool[(Math.random()*pool.length)|0];
  gh.edgeIndex = pick.i; gh.dist = pick.e.length/2; gh.forward = true; gh.waitNode = null;
}

function eatGhost(gh){
  state.points += 200 * Math.pow(2, Math.min(state.frightCombo, 3));
  state.frightCombo = Math.min(state.frightCombo + 1, 3);
  respawnOneGhost(gh);
  updateGhostView(gh);
  updateHud();
}

// Where a ghost is heading right now: Pac-Man, a spot ahead of him, or a corner
// when scattering. Each ghost has a slightly different personality.
function ghostTarget(gh){
  const p = pacPos();
  if(state.ghostMode === 'scatter') return gh.corner || p;
  const h = travelHeading();
  if(gh.name === 'Pinky') return [ p[0]+h.x*70, p[1]+h.y*70 ];
  if(gh.name === 'Inky'){ const g = ghostPos(gh); return [ 2*p[0]-g[0]+h.x*40, 2*p[1]-g[1]+h.y*40 ]; }
  if(gh.name === 'Clyde'){
    const g = ghostPos(gh);
    return Math.hypot(g[0]-p[0], g[1]-p[1]) < 90 ? (gh.corner || p) : p;
  }
  return p;
}

// At a node, head down the road that gets closest to the target (never reversing).
function ghostChoose(gh, nodeId, cameIndex){
  const list = state.adjSim.get(nodeId) || [];
  // Frightened ghosts wander at random instead of chasing.
  if(state.frightTimer > 0){
    const pool = list.filter(c => c.edgeIndex !== cameIndex);
    if(!pool.length) return null;
    const c = pool[(Math.random()*pool.length)|0];
    return { edgeIndex:c.edgeIndex, forward:dirFor(c.edgeIndex, nodeId) };
  }
  const t = ghostTarget(gh);
  let best = null, bestD = Infinity;
  for(const c of list){
    if(c.edgeIndex === cameIndex) continue;
    const e = state.edges[c.edgeIndex];
    const nb = (e.a === nodeId) ? e.b : e.a;
    const np = state.nodePos.get(nb) || e.coords[0];
    const d = Math.hypot(np[0]-t[0], np[1]-t[1]);
    if(d < bestD){ bestD = d; best = c; }
  }
  return best ? { edgeIndex:best.edgeIndex, forward:dirFor(best.edgeIndex, nodeId) } : null;
}

function moveGhost(gh, dt){
  let remaining = ghostSpeed() * (state.frightTimer > 0 ? 0.55 : 1) * dt;
  let guard = 0;
  while(remaining > 0 && guard++ < 24){
    if(gh.waitNode !== null){
      const move = ghostChoose(gh, gh.waitNode, null);
      if(!move) break;
      gh.waitNode = null; gh.edgeIndex = move.edgeIndex; gh.forward = move.forward;
      gh.dist = move.forward ? 0 : state.edges[move.edgeIndex].length;
      continue;
    }
    const e = state.edges[gh.edgeIndex];
    const toEnd = gh.forward ? e.length - gh.dist : gh.dist;
    if(toEnd > 1e-6 && remaining < toEnd){
      gh.dist += gh.forward ? remaining : -remaining;
      remaining = 0;
    } else {
      remaining -= toEnd;
      const endNode = gh.forward ? e.b : e.a;
      gh.dist = gh.forward ? e.length : 0;
      const move = ghostChoose(gh, endNode, gh.edgeIndex);
      if(move){
        gh.edgeIndex = move.edgeIndex; gh.forward = move.forward;
        gh.dist = move.forward ? 0 : state.edges[move.edgeIndex].length;
      } else {
        const wrap = state.wrapMap.get(endNode);
        const exit = wrap ? pickEdgeClosestTo(wrap.node, arrivalHeadingAt(gh.edgeIndex, endNode)) : null;
        if(exit){
          gh.edgeIndex = exit.edgeIndex; gh.forward = exit.forward;
          gh.dist = exit.forward ? 0 : state.edges[exit.edgeIndex].length;
        } else {
          gh.waitNode = endNode; break;
        }
      }
    }
  }
}

function updateGhostView(gh){
  const [x,y] = ghostPos(gh);
  const e = state.edges[gh.edgeIndex];
  const seg = pointAt(e, gh.dist)[2];
  const p0 = e.coords[seg], p1 = e.coords[seg+1] || e.coords[seg];
  let dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  if(!gh.forward){ dx = -dx; dy = -dy; }
  if(gh.pupils && gh.pupils.length){
    const L = Math.hypot(dx, dy) || 1;
    const t = 'translate(' + ((dx/L)*0.10).toFixed(3) + ',' + ((-dy/L)*0.10).toFixed(3) + ')';
    for(const p of gh.pupils) p.setAttribute('transform', t);
  }
  if(gh.marker) gh.marker.setLngLat(toLngLat(x, y));
}

function updateGhosts(dt){
  if(state.invuln > 0) state.invuln = Math.max(0, state.invuln - dt);
  if(!state.ghosts.length) return;
  if(state.frightTimer > 0){
    state.frightTimer -= dt;
    if(state.frightTimer <= 0){ state.frightTimer = 0; state.frightCombo = 0; }
  }
  state.ghostModeTimer -= dt;
  if(state.ghostModeTimer <= 0){
    state.ghostMode = state.ghostMode === 'chase' ? 'scatter' : 'chase';
    state.ghostModeTimer = state.ghostMode === 'chase' ? 8 : 5;
  }
  for(const gh of state.ghosts){ moveGhost(gh, dt); applyGhostSkin(gh); updateGhostView(gh); }
}

function ghostCaught(x, y){
  for(const gh of state.ghosts){
    const g = ghostPos(gh);
    if(Math.hypot(g[0]-x, g[1]-y) <= CATCH_RADIUS) return true;
  }
  return false;
}

function respawnActors(){
  spawnPac();
  clearGhosts();
  spawnGhosts();
  state.invuln = 2;
}

// A ghost touched Pac-Man: lose a life and restart the round, or end the game.
function caught(){
  state.lives--;
  updateHud();
  if(state.lives <= 0){ showGameOver(); return; }
  respawnActors();
}

function showGameOver(){
  state.running = false;
  state.overlayMode = 'caught';
  document.getElementById('stick').hidden = true;
  document.getElementById('hud').hidden = true;
  document.getElementById('ld-title').textContent = 'Caught!';
  document.getElementById('ld-stats').textContent =
    'You reached level ' + state.level + ' with ' + state.points + ' points.';
  document.getElementById('ld-next').textContent = 'Try again';
  document.getElementById('leveldone').hidden = false;
}

// ---------- movement ----------
function movePac(dt){
  const pac = state.pac;
  // instant U-turn: if the player points back the way we came, flip on the spot
  if(pac.waitNode === null){
    const d = desiredVec();
    if(d){
      const h = travelHeading();
      // Only a near-opposite push is a U-turn; a sharp fork still waits for the node.
      if(h.x*d.x + h.y*d.y <= -0.85){
        // dist is measured from coords[0], so flipping direction does NOT move us
        pac.forward = !pac.forward;
        if(swipe) swipe = null;
      }
    }
  }

  let remaining = SPEED * speedFactor() * dt;
  let guard = 0;
  while(remaining > 0 && guard++ < 24){
    if(pac.waitNode !== null){
      const move = chooseAtNode(pac.waitNode, null);
      if(!move) break;
      pac.waitNode = null;
      pac.edgeIndex = move.edgeIndex;
      pac.forward = move.forward;
      pac.dist = move.forward ? 0 : state.edges[move.edgeIndex].length;
      if(swipe) swipe = null;
      continue;
    }
    const e = state.edges[pac.edgeIndex];
    const toEnd = pac.forward ? e.length - pac.dist : pac.dist;
    if(toEnd > 1e-6 && remaining < toEnd){
      pac.dist += pac.forward ? remaining : -remaining;
      remaining = 0;
    } else {
      remaining -= toEnd;
      const endNode = pac.forward ? e.b : e.a;
      pac.dist = pac.forward ? e.length : 0;
      const move = chooseAtNode(endNode, pac.edgeIndex);
      if(move){
        pac.edgeIndex = move.edgeIndex;
        pac.forward = move.forward;
        pac.dist = move.forward ? 0 : state.edges[move.edgeIndex].length;
        if(swipe) swipe = null;
      } else {
        // No road onward: if this is a boundary tunnel, reappear on the far side.
        const wrap = state.wrapMap.get(endNode);
        const exit = wrap ? pickEdgeClosestTo(wrap.node, arrivalHeadingAt(pac.edgeIndex, endNode)) : null;
        if(exit){
          pac.edgeIndex = exit.edgeIndex;
          pac.forward = exit.forward;
          pac.dist = exit.forward ? 0 : state.edges[exit.edgeIndex].length;
          if(swipe) swipe = null;
        } else {
          pac.waitNode = endNode; break;   // hit a wall: stop and wait
        }
      }
    }
  }
}

// ---------- rendering ----------
function buildRoadData(){
  return { type:'FeatureCollection', features: state.edges.map(e => ({
    type:'Feature', properties:{},
    geometry:{ type:'LineString', coordinates: e.coords.map(c => toLngLat(c[0], c[1])) }
  })) };
}

function renderPellets(force){
  if(!state.dirty) return;
  const now = performance.now();
  if(!force && now - state.lastPellet < 90) return;
  state.lastPellet = now; state.dirty = false;
  const features = [];
  for(const p of state.pellets){
    if(p.eaten) continue;
    features.push({ type:'Feature', properties:{},
      geometry:{ type:'Point', coordinates: toLngLat(p.x, p.y) } });
  }
  for(const p of state.powerPellets){
    if(p.eaten) continue;
    features.push({ type:'Feature', properties:{ big:true },
      geometry:{ type:'Point', coordinates: toLngLat(p.x, p.y) } });
  }
  const src = map.getSource('pellets');
  if(src) src.setData({ type:'FeatureCollection', features });
}

function boundaryData(){
  const bb = state.bb;
  return { type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:[
    [bb.west,bb.south],[bb.east,bb.south],[bb.east,bb.north],[bb.west,bb.north],[bb.west,bb.south]
  ]}};
}

// Live dashed box on the map showing where the level will be, so the player can
// see (and aim) the play area before starting.
function previewData(){
  const bb = playBounds();
  return { type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:[
    [bb.west,bb.south],[bb.east,bb.south],[bb.east,bb.north],[bb.west,bb.north],[bb.west,bb.south]
  ]}};
}
function addPreview(){
  if(map.getSource('preview')) return;
  map.addSource('preview', { type:'geojson', data: previewData() });
  map.addLayer({ id:'preview', type:'line', source:'preview',
    paint:{ 'line-color':'#ffe14d', 'line-width':2.5, 'line-dasharray':[2,2], 'line-opacity':0.9 } });
}
function updatePreview(){
  if(state.running || state.loading) return;
  const s = map.getSource('preview');
  if(s) s.setData(previewData());
}
function setPreviewVisible(v){
  if(map.getLayer('preview')) map.setPaintProperty('preview', 'line-opacity', v ? 0.9 : 0);
}

const PORTAL_SHAPES = ['circle','diamond','triangle','square'];
const PORTAL_COLORS = ['#58e1ff','#7cff6b','#ff8ad8','#ffd23f','#b48cff','#ff7a5c'];

// Small canvas-drawn icons so each tunnel mouth gets its own shape, size and
// colour. Both ends of a tunnel share the same one, so matching is obvious.
function makePortalImage(shape, color){
  const S = 12;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S*2;
  const g = cv.getContext('2d');
  g.scale(2,2);
  const c = S/2, r = S/2 - 2;
  g.lineWidth = 1.6;
  g.lineJoin = 'round';
  g.beginPath();
  if(shape === 'circle'){ g.arc(c, c, r, 0, Math.PI*2); }
  else if(shape === 'diamond'){ g.moveTo(c, c-r); g.lineTo(c+r, c); g.lineTo(c, c+r); g.lineTo(c-r, c); g.closePath(); }
  else if(shape === 'triangle'){ g.moveTo(c, c-r); g.lineTo(c+r*0.9, c+r*0.75); g.lineTo(c-r*0.9, c+r*0.75); g.closePath(); }
  else { g.rect(c-r, c-r, 2*r, 2*r); }
  g.strokeStyle = color;
  g.fillStyle = color;
  g.globalAlpha = 0.28; g.fill();
  g.globalAlpha = 1; g.stroke();
  return g.getImageData(0, 0, S*2, S*2);
}

function nodeHash(str){
  const s = String(str);
  let h = 2166136261;
  for(let i=0; i<s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function portalData(){
  const pos = new Map();
  for(const e of state.edges){
    if(!pos.has(e.a)) pos.set(e.a, e.coords[0]);
    if(!pos.has(e.b)) pos.set(e.b, e.coords[e.coords.length-1]);
  }
  const seen = new Set(), features = [];
  for(const [id, w] of state.wrapMap){
    const other = w.node;
    // Node ids are coordinate strings now, so compare them as strings - Math.min
    // would turn them into NaN and silently drop every portal.
    const a = id <= other ? id : other, b = id <= other ? other : id;
    const pairKey = a + '|' + b;
    if(seen.has(pairKey)) continue;
    seen.add(pairKey);
    const h = nodeHash(pairKey);
    const shape = PORTAL_SHAPES[h % PORTAL_SHAPES.length];
    const ci = (h >>> 3) % PORTAL_COLORS.length;
    const props = { icon:'portal-'+shape+'-'+ci, scale:0.55 + ((h >>> 6) % 4) * 0.15 };
    for(const n of [a, b]){
      const xy = pos.get(n);
      if(!xy) continue;
      features.push({ type:'Feature', properties: props, geometry:{ type:'Point', coordinates: toLngLat(xy[0], xy[1]) } });
    }
  }
  return { type:'FeatureCollection', features };
}

function addLayers(){
  removeLayers();

  map.addSource('bounds', { type:'geojson', data: boundaryData() });
  map.addLayer({ id:'bounds', type:'line', source:'bounds',
    paint:{ 'line-color':'#ff5252', 'line-width':2, 'line-dasharray':[2,2], 'line-opacity':0.85 } });

  map.addSource('roads', { type:'geojson', data: buildRoadData() });
  map.addLayer({ id:'roads', type:'line', source:'roads',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color':'#ffd23f', 'line-width':3.5, 'line-opacity':0.5 } });

  PORTAL_SHAPES.forEach((s, si) => {
    PORTAL_COLORS.forEach((c, ci) => {
      const name = 'portal-'+s+'-'+ci;
      if(!(map.hasImage && map.hasImage(name))) map.addImage(name, makePortalImage(s, c));
    });
  });
  map.addSource('portals', { type:'geojson', data: portalData() });
  map.addLayer({ id:'portals', type:'symbol', source:'portals',
    layout:{ 'icon-image':['get','icon'], 'icon-size':['get','scale'],
      'icon-allow-overlap':true, 'icon-ignore-placement':true },
    paint:{ 'icon-opacity':0.9 } });

  map.addSource('pellets', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
  map.addLayer({ id:'pellets', type:'circle', source:'pellets',
    paint:{ 'circle-radius':['case', ['get','big'], 7, 3],
      'circle-color':'#ffffff',
      'circle-stroke-color':['case', ['get','big'], '#9db9de', '#000000aa'],
      'circle-stroke-width':['case', ['get','big'], 2, 0.8] } });

  state.dirty = true;
  renderPellets(true);
}

function removeLayers(){
  for(const id of ['bounds','roads','portals','pellets']){
    if(map.getLayer(id)) map.removeLayer(id);
    if(map.getSource(id)) map.removeSource(id);
  }
}

function addPacMarker(){
  const el = document.createElement('div');
  el.className = 'pac-marker';
  el.innerHTML = '<div class="pac-rot">' + characterSVG(characterById(chosenChar), false) + '</div>';
  state.rot = el.querySelector('.pac-rot');
  state.pupils = el.querySelectorAll ? Array.from(el.querySelectorAll('.pupil')) : [];
  state.marker = new maplibregl.Marker({ element: el, anchor:'center' }).setLngLat([0,0]).addTo(map);
}

function updatePacView(x, y){
  const e = state.edges[state.pac.edgeIndex];
  const seg = pointAt(e, state.pac.dist)[2];
  const p0 = e.coords[seg], p1 = e.coords[seg+1] || e.coords[seg];
  let dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  if(!state.pac.forward){ dx = -dx; dy = -dy; }
  if(state.rot){
    if(characterById(chosenChar).rotate === false){
      state.rot.style.transform = '';           // ghosts stay upright
    } else {
      const deg = Math.atan2(-dy, dx) * 180/Math.PI;
      state.rot.style.transform = 'rotate(' + deg.toFixed(1) + 'deg)';
    }
  }
  if(state.pupils && state.pupils.length){
    const len = Math.hypot(dx, dy) || 1;
    const tx = (dx/len)*0.10, ty = (-dy/len)*0.10;   // screen y is inverted
    const t = 'translate(' + tx.toFixed(3) + ',' + ty.toFixed(3) + ')';
    for(const p of state.pupils) p.setAttribute('transform', t);
  }
  if(state.marker) state.marker.setLngLat(toLngLat(x, y));
}

function updateHud(){
  const total = state.pellets.length + state.powerPellets.length;
  document.getElementById('score').textContent =
    'Lv ' + state.level + ' · ' + state.points + ' pts · ' + state.score + '/' + total;
  const lv = document.getElementById('lives');
  if(lv){
    if(difficultyById(state.difficulty).ghosts > 0){ lv.hidden = false; lv.textContent = 'Lives ' + state.lives; }
    else lv.hidden = true;
  }
}

// ---------- loop ----------
function frame(now){
  if(!state.running) return;
  const dt = Math.min(0.05, (now - state.last)/1000 || 0);
  state.last = now;
  movePac(dt);
  let [x,y] = pacPos();
  eatAround(x,y);
  updateGhosts(dt);
  if(state.ghosts.length){
    for(const gh of state.ghosts){
      const g = ghostPos(gh);
      if(Math.hypot(g[0]-x, g[1]-y) > CATCH_RADIUS) continue;
      if(state.frightTimer > 0){
        eatGhost(gh);                       // power pellet active: ghost is edible
      } else if(state.invuln <= 0){
        caught();
        if(!state.running) return;
        [x,y] = pacPos();
        break;
      }
    }
  }
  updatePacView(x,y);
  renderPellets(false);
  updateHud();
  if((state.pellets.length + state.powerPellets.length) && dotsRemaining() === 0){ levelComplete(); return; }
  requestAnimationFrame(frame);
}

// ---------- game lifecycle ----------
function boundsAround(lat, lng){
  const mlat = 111320, mlon = 111320*Math.cos(lat*Math.PI/180);
  const dLat = PLAY_HALF/mlat, dLon = PLAY_HALF/mlon;
  return { south:lat-dLat, north:lat+dLat, west:lng-dLon, east:lng+dLon };
}
function playBounds(){
  const c = map.getCenter();
  return boundsAround(c.lat, c.lng);
}

// Quietly read the roads for wherever the map is aimed, so pressing Start is

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Road Pac</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#0b0d12;
    font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;color:#111}
  #map{position:absolute;inset:0;touch-action:none}

  #panel{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));
    max-width:360px;margin:0 auto;background:#fff;border-radius:16px;padding:16px;
    box-shadow:0 12px 40px #0007;z-index:6;
    max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #panel-head{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
  #panel-head h1{margin:0 0 2px;font-size:20px}
  #panel-head .sub{margin:0 0 12px;color:#666;font-size:13px}
  #panel-toggle{flex:0 0 auto;width:36px;height:36px;min-height:0;padding:0;font-size:15px;line-height:1;
    background:#f0f0f0;border:1px solid #ddd;border-radius:999px}
  #panel.collapsed #panel-body,#panel.collapsed #panel-foot{display:none}
  #panel.collapsed{padding-bottom:12px}
  #panel label{display:block;font-size:12px;color:#555;margin:0 0 8px}
  #panel input{width:100%;margin-top:4px;padding:11px;border:1px solid #cfcfcf;border-radius:9px;font-size:16px}
  .row{display:flex;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:1px solid #cfcfcf;background:#f6f6f6;
    padding:12px;min-height:46px;border-radius:9px;color:#111}
  button.primary{width:100%;background:#ffe14d;border-color:#e6c400;font-weight:700;margin-top:4px}
  button:active{transform:translateY(1px)}
  #status{font-size:12.5px;color:#555;min-height:32px;margin:6px 0}
  #panel small{display:block;color:#8a8a8a;font-size:11px;margin-top:10px;line-height:1.4}

  .charlabel{font-size:12px;color:#555;margin:2px 0 4px}
  .chars{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
  .char{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:#fff;border:2px solid #e2e2e2;border-radius:12px;padding:6px 10px;min-height:0}
  .char.sel{border-color:#ffcf00;background:#fffbe6}
  .char svg{width:30px;height:30px;display:block}
  .char span{font-size:10px;color:#555;white-space:nowrap}

  #hud{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;
    display:flex;gap:8px;align-items:center}
  #score{background:#000000aa;color:#ffe14d;font-weight:800;padding:9px 14px;border-radius:999px;
    box-shadow:0 4px 16px #0006}
  #menu{background:#000000aa;color:#fff;border:none;min-height:0;padding:10px 14px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  #stick{position:absolute;right:calc(16px + env(safe-area-inset-right));
    bottom:calc(20px + env(safe-area-inset-bottom));z-index:4;opacity:.92;touch-action:none}
  #stick-base{width:148px;height:148px;border-radius:50%;background:#ffffff1c;
    border:2px solid #ffffff33;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
  #stick-base::after{content:"";position:absolute;inset:24px;border-radius:50%;border:1px dashed #ffffff22}
  #stick-knob{width:62px;height:62px;border-radius:50%;background:#ffffff55;border:2px solid #ffffff88;
    box-shadow:0 4px 14px #0006;will-change:transform;touch-action:none}

  .pac-marker{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 1px 2px #0009)}
  .pac-rot{will-change:transform;display:flex}

  #leveldone{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    padding:20px;background:#00000055;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #leveldone .card{background:#fff;border-radius:18px;padding:22px 20px;width:min(340px,90vw);
    text-align:center;box-shadow:0 20px 50px #0009}
  #leveldone h2{margin:0 0 6px;font-size:22px}
  #leveldone p{margin:0 0 16px;color:#666;font-size:13px}
  #leveldone button{width:100%;margin-top:8px}

  /* Phones: turn the card into a bottom sheet so the map (and level preview) stays visible. */
  @media (max-width:640px){
    #panel{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));
      max-width:560px;border-radius:18px;max-height:64dvh}
    #hud{top:calc(10px + env(safe-area-inset-top))}
    #stick-base{width:132px;height:132px}
    #stick-knob{width:56px;height:56px}
  }
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="panel-head">
    <div>
      <h1>Road Pac</h1>
      <p class="sub">Pac-Man over real city streets.</p>
    </div>
    <button id="panel-toggle" title="Show or hide the search options" aria-label="Show or hide search options">&#9662;</button>
  </div>
  <div id="panel-body">
    <label>City or address
      <input id="search" type="text" placeholder="e.g. Greenwich Village, NYC" autocomplete="off">
    </label>
    <div class="row">
      <button id="go">Search</button>
      <button id="loc">Use my location</button>
    </div>
    <div class="charlabel">Character</div>
    <div id="chars" class="chars"></div>
  </div>
  <p id="status">Find a city, aim the map, then start.</p>
  <button id="start" class="primary">Start game here</button>
  <div id="panel-foot">
    <small>The dashed box shows the level area. Pan the map to move it.
      Roads &copy; OpenStreetMap contributors via Overpass. Geocoding via Nominatim.</small>
  </div>
</div>

<div id="hud" hidden>
  <div id="score">Dots: 0</div>
  <button id="menu">Menu</button>
</div>

<div id="stick" hidden>
  <div id="stick-base"><div id="stick-knob"></div></div>
</div>

<div id="leveldone" hidden>
  <div class="card">
    <h2 id="ld-title">Level cleared!</h2>
    <p id="ld-stats"></p>
    <button id="ld-next" class="primary">Next level</button>
    <button id="ld-menu">Back to menu</button>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const MOUTH_VALUES =
  'M0,0 L1,-0.02 A1,1 0 1 0 1,0.02 Z;' +
  'M0,0 L0.62,-0.78 A1,1 0 1 0 0.62,0.78 Z;' +
  'M0,0 L1,-0.02 A1,1 0 1 0 1,0.02 Z';
// Lipstick follows the mouth edges: a red "<" that opens and closes with it.
const LIP_VALUES =
  'M0,0 L1,-0.02 M0,0 L1,0.02;' +
  'M0,0 L0.62,-0.78 M0,0 L0.62,0.78;' +
  'M0,0 L1,-0.02 M0,0 L1,0.02';
const MS_LIPS_OPEN = '<path d="M0,0 L0.62,-0.78 M0,0 L0.62,0.78" stroke="#e23b3b" stroke-width="0.09" fill="none" stroke-linecap="round"/>';
const MS_LIPS_ANIM = '<path stroke="#e23b3b" stroke-width="0.09" fill="none" stroke-linecap="round">' +
  '<animate attributeName="d" dur="0.3s" repeatCount="indefinite" calcMode="linear" values="'+LIP_VALUES+'"/></path>';
// Everything Ms. Pac-Man wears on top of her body: eye + lashes, a beauty spot
// on the cheek, and a red hair-bow.
const MS_PARTS =
  '<circle cx="0.26" cy="-0.55" r="0.12" fill="#1a1a1a"/>' +
  '<path d="M0.14,-0.70 L0.04,-0.86 M0.36,-0.68 L0.42,-0.86" stroke="#1a1a1a" stroke-width="0.07" fill="none" stroke-linecap="round"/>' +
  '<circle cx="0.36" cy="0.58" r="0.055" fill="#3a2a08"/>' +
  '<path d="M-0.02,-0.98 L-0.34,-1.12 L-0.26,-0.82 Z" fill="#e23b3b"/>' +
  '<path d="M-0.02,-0.98 L0.30,-1.12 L0.22,-0.82 Z" fill="#e23b3b"/>' +
  '<circle cx="-0.02" cy="-0.98" r="0.09" fill="#c62f2f"/>';

const CHARACTERS = [
  { id:'pacman',   name:'Pac-Man',     kind:'pac',   body:'#ffe14d', stroke:'#caa400',
    decoStatic:'', decoAnimated:'' },
  { id:'mspacman', name:'Ms. Pac-Man', kind:'pac',   body:'#ffd93b', stroke:'#cf9d00',
    decoStatic: MS_LIPS_OPEN + MS_PARTS, decoAnimated: MS_LIPS_ANIM + MS_PARTS },
  { id:'boo',      name:'Boo',         kind:'ghost', body:'#7fe0a2', stroke:'#37a35f', pupil:'#233b6b',
    rotate:false },
  { id:'dottie',   name:'Dottie',      kind:'pellet',body:'#ffffff', stroke:'#9db9de', pupil:'#26415c',
    rotate:false },
  { id:'chester',  name:'Chester',     kind:'chest', body:'#8a5a2b', stroke:'#5c3a17',
    rotate:false }
];
let chosenChar = 'pacman';
function characterById(id){ return CHARACTERS.find(c => c.id === id) || CHARACTERS[0]; }

function pacSVG(ch, preview){
  const body = preview
    ? '<path fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.05" d="M0,0 L0.62,-0.78 A1,1 0 1 0 0.62,0.78 Z"/>'
    : '<path fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.05">' +
      '<animate attributeName="d" dur="0.3s" repeatCount="indefinite" calcMode="linear" values="'+MOUTH_VALUES+'"/></path>';
  return '<svg viewBox="-1.2 -1.35 2.4 2.6" width="30" height="30">' + body +
    (preview ? ch.decoStatic : ch.decoAnimated) + '</svg>';
}

// A ghost in the classic four-ghost style: domed head, scalloped skirt, big
// white eyes whose pupils look the way it's heading. Drawn upright (never
// rotated) with the same gentle bob the arcade ghosts have. Boo is green to
// show he's on your side.
function ghostSVG(ch, preview){
  const content =
    '<path d="M-0.85,0.55 L-0.85,-0.15 A0.85,0.85 0 0 1 0.85,-0.15 L0.85,0.55 ' +
      'Q0.6375,0.30 0.425,0.55 Q0.2125,0.30 0,0.55 Q-0.2125,0.30 -0.425,0.55 Q-0.6375,0.30 -0.85,0.55 Z" ' +
      'fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.06" stroke-linejoin="round"/>' +
    '<ellipse cx="-0.32" cy="-0.35" rx="0.26" ry="0.32" fill="#ffffff"/>' +
    '<ellipse cx="0.32" cy="-0.35" rx="0.26" ry="0.32" fill="#ffffff"/>' +
    '<g class="pupil"><circle cx="-0.32" cy="-0.33" r="0.13" fill="'+ch.pupil+'"/></g>' +
    '<g class="pupil"><circle cx="0.32" cy="-0.33" r="0.13" fill="'+ch.pupil+'"/></g>';
  const wrap = preview ? content
    : '<g>' + content + '<animateTransform attributeName="transform" type="translate" values="0,0;0,-0.08;0,0" dur="0.9s" repeatCount="indefinite"/></g>';
  return '<svg viewBox="-1 -1.1 2 2" width="30" height="30">' + wrap + '</svg>';
}
// Dottie is a large power-pellet (white, like the dots) with one small eye,
// sitting where Pac-Man's eye sits. She softly pulses.
function pelletSVG(ch, preview){
  const aura = preview
    ? '<circle r="1.08" fill="#ffffff" opacity="0.18"/>'
    : '<circle r="1.08" fill="#ffffff" opacity="0.18">' +
      '<animate attributeName="r" values="1.02;1.16;1.02" dur="1.1s" repeatCount="indefinite"/>' +
      '<animate attributeName="opacity" values="0.24;0.10;0.24" dur="1.1s" repeatCount="indefinite"/></circle>';
  return '<svg viewBox="-1.3 -1.3 2.6 2.6" width="30" height="30">' + aura +
    '<circle r="0.95" fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.07"/>' +
    '<ellipse cx="-0.40" cy="-0.40" rx="0.22" ry="0.14" fill="#dce7f6"/>' +
    '<ellipse cx="0.26" cy="-0.55" rx="0.15" ry="0.18" fill="#ffffff" stroke="'+ch.stroke+'" stroke-width="0.035"/>' +
    '<circle cx="0.26" cy="-0.55" r="0.08" fill="'+ch.pupil+'"/>' +
    '</svg>';
}

// A treasure chest with two eyes: wooden body, domed lid, brass rim and lock.
function chestSVG(ch, preview){
  const lid = '#a06a34', brass = '#e0b23c', brassDark = '#a97d1e';
  const content =
    '<rect x="-0.80" y="-0.06" width="1.60" height="0.76" rx="0.06" fill="'+ch.body+'" stroke="'+ch.stroke+'" stroke-width="0.06"/>' +
    '<path d="M-0.80,-0.06 L-0.80,-0.30 A0.80,0.30 0 0 1 0.80,-0.30 L0.80,-0.06 Z" fill="'+lid+'" stroke="'+ch.stroke+'" stroke-width="0.06" stroke-linejoin="round"/>' +
    '<line x1="-0.78" y1="0.26" x2="0.78" y2="0.26" stroke="'+ch.stroke+'" stroke-width="0.04" opacity="0.45"/>' +
    '<line x1="-0.78" y1="0.52" x2="0.78" y2="0.52" stroke="'+ch.stroke+'" stroke-width="0.04" opacity="0.45"/>' +
    '<rect x="-0.84" y="-0.12" width="1.68" height="0.13" rx="0.03" fill="'+brass+'" stroke="'+brassDark+'" stroke-width="0.03"/>' +
    '<rect x="-0.15" y="0.00" width="0.30" height="0.32" rx="0.05" fill="'+brass+'" stroke="'+brassDark+'" stroke-width="0.04"/>' +
    '<circle cx="0" cy="0.12" r="0.05" fill="#3a2a08"/>' +
    '<path d="M-0.032,0.14 L0.032,0.14 L0.022,0.25 L-0.022,0.25 Z" fill="#3a2a08"/>' +
    '<ellipse cx="-0.30" cy="-0.38" rx="0.18" ry="0.20" fill="#ffffff"/>' +
    '<ellipse cx="0.30" cy="-0.38" rx="0.18" ry="0.20" fill="#ffffff"/>' +
    '<g class="pupil"><circle cx="-0.30" cy="-0.36" r="0.085" fill="#233b6b"/></g>' +
    '<g class="pupil"><circle cx="0.30" cy="-0.36" r="0.085" fill="#233b6b"/></g>' +
    '<ellipse cx="-0.36" cy="-0.50" rx="0.12" ry="0.06" fill="#ffffff" opacity="0.3"/>';
  return '<svg viewBox="-1 -1 2 2" width="30" height="30">' + content + '</svg>';
}

function characterSVG(ch, preview){
  if(ch.kind === 'ghost')  return ghostSVG(ch, preview);
  if(ch.kind === 'pellet') return pelletSVG(ch, preview);
  if(ch.kind === 'chest')  return chestSVG(ch, preview);
  return pacSVG(ch, preview);
}

const SPEED = 62;             // metres / second, at level 1
const SPEED_STEP = 0.12;      // each cleared level makes Pac-Man this much faster
const MAX_SPEED_MULT = 2.2;   // cap so later levels stay playable
function speedFactor(){ return Math.min(MAX_SPEED_MULT, 1 + (state.level - 1) * SPEED_STEP); }
const PELLET_SPACING = 25;    // metres between dots
const EAT_RADIUS = 9;         // metres
const CELL = 24;              // spatial grid cell (metres)
const CONTINUE_DOT = 0.25;    // cos(~75deg): auto-continue only through gentle bends
const PLAY_HALF = 350;        // half-size of play area (metres)
const MIN_STUB = 35;          // metres: dead-end stubs shorter than this are dropped
const MAX_PAIR = 220;         // metres: opposite-edge roads up to this far apart form a tunnel
const MERGE_DIST = 25;        // metres: dual carriageways closer than this merge into one
const PARALLEL_DOT = 0.97;    // cos(~14°): headings this close count as the same road
const PERP_MAX = 0.8;         // side-by-side: offset must be mostly perpendicular to the road
const ROAD_TYPES = 'trunk|primary|secondary|tertiary|unclassified|residential';
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];
const OVERPASS_TIMEOUT = 20000;   // abort an endpoint that hangs this long
const OVERPASS_STAGGER = 2000;    // start each fallback endpoint this much later
const DRV = { up:{x:0,y:1}, down:{x:0,y:-1}, left:{x:-1,y:0}, right:{x:1,y:0} };

// Roads are cached per play-area box and shared by concurrent requests, so
// panning around (prefetch) makes "Start" feel instant afterwards.
const roadCache = new Map();
const roadPending = new Map();
function bboxKey(bb){ return [bb.south,bb.west,bb.north,bb.east].map(v => v.toFixed(5)).join(','); }

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/dark',
  center: [-74.0, 40.73],
  zoom: 16,
  dragRotate: false,
  pitchWithRotate: false,
  keyboard: false,
  attributionControl: false
});
map.addControl(new maplibregl.AttributionControl({ compact:true, customAttribution:'Roads &copy; OpenStreetMap contributors' }), 'top-right');
map.touchZoomRotate.disableRotation();

const proj = { lng0:0, lat0:0, mlon:1, mlat:111320 };
function toXY(lng, lat){ return [ (lng-proj.lng0)*proj.mlon, (lat-proj.lat0)*proj.mlat ]; }
function toLngLat(x, y){ return [ proj.lng0 + x/proj.mlon, proj.lat0 + y/proj.mlat ]; }

const state = {
  running:false, loading:false, edges:[], adjSim:new Map(), pellets:[], grid:new Map(),
  pac:null, score:0, level:1, last:0, dirty:false, lastPellet:0, marker:null, rot:null, pupils:[],
  boundary:new Set(), wrapMap:new Map()
};
let keyHeld = null;       // { x, y } from keyboard
let stick = null;         // { x, y } from the analog joystick
let swipe = null;         // { x, y, t } from a swipe gesture

// ---------- Overpass + graph ----------
async function fetchOverpass(bb){
  const key = bboxKey(bb);
  if(roadCache.has(key)) return roadCache.get(key);
  if(roadPending.has(key)) return roadPending.get(key);
  const p = requestOverpass(bb).then(
    data => { roadCache.set(key, data); roadPending.delete(key); return data; },
    err  => { roadPending.delete(key); throw err; }
  );
  roadPending.set(key, p);
  return p;
}

// Race the mirrors (staggered, so a healthy first mirror wins without load)
// and abort whatever is still hanging so the player never waits on a dead one.
async function requestOverpass(bb){
  const q = '[out:json][timeout:25];way["highway"~"^('+ROAD_TYPES+')"](' +
    bb.south+','+bb.west+','+bb.north+','+bb.east+');(._;>;);out body;';
  const controllers = [];
  let done = false;
  const attempt = (url, delay) => new Promise((resolve, reject) => {
    const ctrl = new AbortController();
    controllers.push(ctrl);
    setTimeout(() => {
      if(done){ reject(new Error('skipped')); return; }
      const timer = setTimeout(() => ctrl.abort(), OVERPASS_TIMEOUT);
      fetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
        body:'data='+encodeURIComponent(q),
        signal:ctrl.signal
      })
        .then(res => { if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
        .then(j => { clearTimeout(timer); if(!j.elements || !j.elements.length) throw new Error('no roads returned'); resolve(j); })
        .catch(e => { clearTimeout(timer); reject(e); });
    }, delay);
  });
  try{
    return await Promise.any(OVERPASS.map((u,i) => attempt(u, i*OVERPASS_STAGGER)));
  }catch(e){
    throw new Error('Could not load roads - Overpass may be busy. Try again in a moment.');
  }finally{
    done = true;
    for(const c of controllers) if(!c.signal.aborted) c.abort();
  }
}

// Raw OSM nodes are dense shape points; collapse chains of degree-2 nodes into
// single polyline edges so curves are followed smoothly and turns only happen
// at real intersections.
function buildGraph(osm, bb){
  const rawXY = new Map();
  for(const el of osm.elements){
    if(el.type === 'node') rawXY.set(el.id, toXY(el.lon, el.lat));
  }

  const ways = [];
  const nodeKeys = new Map();
  const rawNeighbors = new Set();
  const pk = (a,b) => (a < b ? a+'_'+b : b+'_'+a);
  for(const el of osm.elements){
    if(el.type !== 'way') continue;
    const t = el.tags || {};
    const rkey = String(t.name || t.ref || '').trim();
    ways.push({ nodes: el.nodes });
    if(rkey){
      for(const n of el.nodes){
        if(!nodeKeys.has(n)) nodeKeys.set(n, new Set());
        nodeKeys.get(n).add(rkey);
      }
    }
    for(let i=0; i+1<el.nodes.length; i++) rawNeighbors.add(pk(el.nodes[i], el.nodes[i+1]));
  }

  // Heading of the road at each raw node (unit vectors to its neighbours), used
  // to spot two roads running side by side.
  const dirs = new Map();
  const addDir = (n, dx, dy) => {
    const L = Math.hypot(dx, dy); if(L < 1e-6) return;
    if(!dirs.has(n)) dirs.set(n, []);
    dirs.get(n).push({ x:dx/L, y:dy/L });
  };
  for(const w of ways){
    for(let i=0; i+1<w.nodes.length; i++){
      const A = rawXY.get(w.nodes[i]), B = rawXY.get(w.nodes[i+1]);
      if(!A || !B) continue;
      addDir(w.nodes[i], B[0]-A[0], B[1]-A[1]);
      addDir(w.nodes[i+1], A[0]-B[0], A[1]-B[1]);
    }
  }

  // Union nearby nodes belonging to parallel one-way carriageways of the same
  // road, so divided roads / highways collapse to a single centreline.
  const parent = new Map();
  for(const id of rawXY.keys()) parent.set(id, id);
  const find = x => { let r = x; while(parent.get(r) !== r) r = parent.get(r); while(parent.get(x) !== r){ const nx = parent.get(x); parent.set(x, r); x = nx; } return r; };
  const union = (a,b) => { a = find(a); b = find(b); if(a !== b) parent.set(a, b); };

  // Two nearby nodes belong to the same road if they share a name/ref, or if
  // both are unnamed and their roads run near-collinear and side by side (the
  // connecting offset is mostly perpendicular to that heading). This keeps
  // genuinely different parallel streets apart while collapsing two lanes of a
  // single road — even when it carries no name or oneway tag.
  const sharesName = (a, b) => {
    const ka = nodeKeys.get(a), kb = nodeKeys.get(b);
    if(!ka || !kb) return false;
    for(const k of ka){ if(kb.has(k)) return true; }
    return false;
  };
  const bothUnnamed = (a, b) => !nodeKeys.has(a) && !nodeKeys.has(b);
  const sideBySide = (a, b, dx, dy, dist) => {
    const da = dirs.get(a), db = dirs.get(b);
    if(!da || !db || dist < 1e-3) return false;
    const ux = dx/dist, uy = dy/dist;
    for(const p of da) for(const q of db){
      if(p.x*q.x + p.y*q.y < PARALLEL_DOT) continue;   // headings run the same way
      if(Math.abs(ux*p.x + uy*p.y) < PERP_MAX) return true;  // offset lies across them
    }
    return false;
  };

  const cell = MERGE_DIST;
  const buckets = new Map();
  const bk = (x,y) => Math.floor(x/cell)+','+Math.floor(y/cell);
  for(const id of rawXY.keys()){
    const xy = rawXY.get(id);
    const k = bk(xy[0], xy[1]);
    if(!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(id);
  }
  for(const id of rawXY.keys()){
    const xy = rawXY.get(id);
    const cx = Math.floor(xy[0]/cell), cy = Math.floor(xy[1]/cell);
    for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
      const arr = buckets.get((cx+i)+','+(cy+j));
      if(!arr) continue;
      for(const id2 of arr){
        if(id2 <= id) continue;
        if(rawNeighbors.has(pk(id, id2))) continue;        // never merge points along the same way
        const xy2 = rawXY.get(id2);
        const dx = xy2[0]-xy[0], dy = xy2[1]-xy[1];
        const dist = Math.hypot(dx, dy);
        if(dist > cell) continue;
        if(sharesName(id, id2) || (bothUnnamed(id, id2) && sideBySide(id, id2, dx, dy, dist))) union(id, id2);
      }
    }
  }

  // Representative position of each cluster = centroid (the centreline).
  const sumX = new Map(), sumY = new Map(), cnt = new Map();
  for(const id of rawXY.keys()){
    const r = find(id), xy = rawXY.get(id);
    sumX.set(r, (sumX.get(r)||0)+xy[0]);
    sumY.set(r, (sumY.get(r)||0)+xy[1]);
    cnt.set(r, (cnt.get(r)||0)+1);
  }
  const nodes = new Map();
  for(const r of cnt.keys()) nodes.set(r, [ sumX.get(r)/cnt.get(r), sumY.get(r)/cnt.get(r) ]);
  const inBox = r => {
    const xy = nodes.get(r);
    if(!xy) return false;
    const lng = proj.lng0 + xy[0]/proj.mlon, lat = proj.lat0 + xy[1]/proj.mlat;
    return lng >= bb.west && lng <= bb.east && lat >= bb.south && lat <= bb.north;
  };

  const adj = new Map();
  const boundary = new Set();
  const link = (a,b) => { if(!adj.has(a)) adj.set(a,new Set()); adj.get(a).add(b); };
  for(const w of ways){
    let prev = null, prevInside = false;
    for(const n of w.nodes){
      if(!rawXY.has(n)) continue;
      const r = find(n);
      const inside = nodes.has(r) && inBox(r);
      if(prev !== null){
        if(prevInside && inside && r !== prev){ link(prev, r); link(r, prev); }
        else if(prevInside && !inside){ boundary.add(prev); }   // road runs past the edge
        else if(!prevInside && inside){ boundary.add(r); }
      }
      prev = r; prevInside = inside;
    }
  }
  const degree = id => (adj.get(id) ? adj.get(id).size : 0);
  const used = new Set();
  const key = (a,b) => a+'_'+b;
  const edges = [];

  const walk = (start, first) => {
    const ids = [start];
    const coords = [nodes.get(start)];
    let prev = start, cur = first, guard = 0;
    used.add(key(start,first)); used.add(key(first,start));
    while(guard++ < 200000){
      ids.push(cur); coords.push(nodes.get(cur));
      if(cur === start) break;
      if(degree(cur) !== 2) break;
      const nbrs = adj.get(cur);
      let next;
      for(const n of nbrs){ if(n !== prev){ next = n; break; } }
      if(next === undefined) break;
      used.add(key(cur,next)); used.add(key(next,cur));
      prev = cur; cur = next;
    }
    return { ids, coords };
  };

  const push = (ids, coords) => {
    if(ids.length < 2) return;
    const cum = [0];
    for(let i=1; i<coords.length; i++){
      cum.push(cum[i-1] + Math.hypot(coords[i][0]-coords[i-1][0], coords[i][1]-coords[i-1][1]));
    }
    edges.push({ a:ids[0], b:ids[ids.length-1], ids, coords, cum, length:cum[cum.length-1] });
  };

  for(const a of adj.keys()){
    if(degree(a) === 2) continue;
    for(const b of adj.get(a)){ if(used.has(key(a,b))) continue; const w = walk(a,b); push(w.ids,w.coords); }
  }
  for(const a of adj.keys()){
    if(degree(a) !== 2) continue;
    for(const b of adj.get(a)){ if(used.has(key(a,b))) continue; const w = walk(a,b); push(w.ids,w.coords); }
  }

  const adjSim = new Map();
  edges.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });

  return { edges, adjSim, boundary };
}

// Drop very short dead-end roads so Pac-Man isn't stopped by tiny spurs. Runs
// repeatedly, so a dead-end branch made of several short edges disappears too.
function pruneShortDeadEnds(minLen){
  const edges = state.edges;
  let changed = true, guard = 0;
  while(changed && guard++ < 500){
    changed = false;
    const deg = new Map();
    for(const e of edges){
      if(e.removed) continue;
      deg.set(e.a, (deg.get(e.a)||0)+1);
      deg.set(e.b, (deg.get(e.b)||0)+1);
    }
    for(const e of edges){
      if(e.removed || e.length >= minLen) continue;
      const deadA = (deg.get(e.a)||0) <= 1 && !state.wrapMap.has(e.a);
      const deadB = (deg.get(e.b)||0) <= 1 && !state.wrapMap.has(e.b);
      if(deadA || deadB){ e.removed = true; changed = true; }
    }
  }
  const kept = edges.filter(e => !e.removed);
  const adjSim = new Map();
  kept.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });
  state.edges = kept;
  state.adjSim = adjSim;
}

// A road too short to hold even one dot gives the player nothing to collect, so
// cut it. Runs before tunnel pairing so any dead-ends it creates get cleaned up.
function hasRoomForDot(e){ return e.length - 1 > PELLET_SPACING*0.5; }
function clipDotlessEdges(){
  const kept = state.edges.filter(hasRoomForDot);
  if(kept.length === state.edges.length) return;
  const adjSim = new Map();
  kept.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });
  state.edges = kept;
  state.adjSim = adjSim;
}

// Give every remaining dead-end a portal by pairing it with its nearest other
// dead-end, so no road just stops at a wall. A lone leftover (or two ends of the
// same road) can't pair and gets cut by pruneShortDeadEnds(Infinity) afterwards.
function wrapDeadEnds(){
  const deg = new Map(), pos = new Map();
  const direct = new Set();
  const pk = (a,b) => a <= b ? a+'_'+b : b+'_'+a;
  for(const e of state.edges){
    deg.set(e.a, (deg.get(e.a)||0)+1);
    deg.set(e.b, (deg.get(e.b)||0)+1);
    if(!pos.has(e.a)) pos.set(e.a, e.coords[0]);
    if(!pos.has(e.b)) pos.set(e.b, e.coords[e.coords.length-1]);
    direct.add(pk(e.a, e.b));
  }
  const leaves = [];
  for(const [n,d] of deg){
    if(d === 1 && !state.wrapMap.has(n) && pos.has(n)) leaves.push(n);
  }
  const used = new Set();
  for(const a of leaves){
    if(used.has(a)) continue;
    const pa = pos.get(a);
    let best = null, bd = Infinity;
    for(const b of leaves){
      if(b === a || used.has(b) || direct.has(pk(a,b))) continue;
      const pb = pos.get(b);
      const d = Math.hypot(pa[0]-pb[0], pa[1]-pb[1]);
      if(d < bd){ bd = d; best = b; }
    }
    if(best !== null){
      state.wrapMap.set(a, { node:best });
      state.wrapMap.set(best, { node:a });
      used.add(a); used.add(best);
    }
  }
}

// Keep only the roads Pac-Man can actually reach from where he starts, so every
// dot is collectable. Tunnels count as connections between their two mouths.
function keepLargestComponent(){
  const adj = state.adjSim;
  const seen = new Set();
  const comps = [];
  const compOf = new Map();
  for(const start of adj.keys()){
    if(seen.has(start)) continue;
    const comp = { nodes:new Set(), len:0 };
    const stack = [start];
    seen.add(start);
    while(stack.length){
      const n = stack.pop();
      comp.nodes.add(n); compOf.set(n, comp);
      for(const c of (adj.get(n)||[])){
        const e = state.edges[c.edgeIndex];
        const nb = (e.a === n) ? e.b : e.a;
        if(!seen.has(nb)){ seen.add(nb); stack.push(nb); }
      }
      const w = state.wrapMap.get(n);
      if(w && !seen.has(w.node)){ seen.add(w.node); stack.push(w.node); }
    }
    comps.push(comp);
  }
  if(comps.length <= 1) return;
  for(const e of state.edges) compOf.get(e.a).len += e.length;
  let main = comps[0];
  for(const c of comps) if(c.len > main.len) main = c;
  state.edges = state.edges.filter(e => main.nodes.has(e.a) && main.nodes.has(e.b));
  const adjSim = new Map();
  state.edges.forEach((e, ei) => {
    if(!adjSim.has(e.a)) adjSim.set(e.a, []);
    adjSim.get(e.a).push({ edgeIndex:ei, node:e.a });
    if(!adjSim.has(e.b)) adjSim.set(e.b, []);
    adjSim.get(e.b).push({ edgeIndex:ei, node:e.b });
  });
  state.adjSim = adjSim;
}

// Pair up roads that run past opposite edges of the play area so Pac-Man can
// drive off one side and reappear on the other, like a Pac-Man tunnel.
function buildWraps(bb){
  const xw = (bb.west - proj.lng0)*proj.mlon, xe = (bb.east - proj.lng0)*proj.mlon;
  const ys = (bb.south - proj.lat0)*proj.mlat, yn = (bb.north - proj.lat0)*proj.mlat;
  const deg = new Map();
  for(const e of state.edges){
    deg.set(e.a, (deg.get(e.a)||0)+1);
    deg.set(e.b, (deg.get(e.b)||0)+1);
  }
  const north = [], south = [], east = [], west = [];
  const seen = new Set();
  const consider = (id, pos) => {
    if(seen.has(id) || !state.boundary.has(id) || (deg.get(id)||0) !== 1) return;
    seen.add(id);
    const [x,y] = pos;
    const dn = yn - y, ds = y - ys, de = xe - x, dw = x - xw;
    const m = Math.min(dn, ds, de, dw);
    if(m === dn) north.push({ id, c:x });
    else if(m === ds) south.push({ id, c:x });
    else if(m === de) east.push({ id, c:y });
    else west.push({ id, c:y });
  };
  for(const e of state.edges){
    consider(e.a, e.coords[0]);
    consider(e.b, e.coords[e.coords.length-1]);
  }
  const wrapMap = new Map();
  const pair = (A, B) => {
    const used = new Set();
    for(const a of A){
      let best = null, bd = MAX_PAIR;
      for(const b of B){
        if(used.has(b.id)) continue;
        const d = Math.abs(a.c - b.c);
        if(d < bd){ bd = d; best = b; }
      }
      if(best){ used.add(best.id); wrapMap.set(a.id, { node:best.id }); wrapMap.set(best.id, { node:a.id }); }
    }
  };
  pair(north, south);
  pair(east, west);
  state.wrapMap = wrapMap;
}

// Edge leaving a node whose heading best matches dir (used when exiting a tunnel).
function pickEdgeClosestTo(nodeId, dir){
  const inc = state.adjSim.get(nodeId) || [];
  let best = null, bestDot = -Infinity;
  for(const c of inc){
    const h = headingFrom(nodeId, c.edgeIndex);
    const dot = h.x*dir.x + h.y*dir.y;
    if(dot > bestDot){ bestDot = dot; best = c; }
  }
  return best ? { edgeIndex:best.edgeIndex, forward:dirFor(best.edgeIndex, nodeId) } : null;
}

function pointAt(e, d){
  d = Math.max(0, Math.min(e.length, d));
  let lo = 0, hi = e.cum.length - 1;
  while(lo < hi - 1){ const mid = (lo + hi) >> 1; if(e.cum[mid] <= d) lo = mid; else hi = mid; }
  const span = (e.cum[hi] - e.cum[lo]) || 1;
  const t = (d - e.cum[lo]) / span;
  return [
    e.coords[lo][0] + (e.coords[hi][0] - e.coords[lo][0]) * t,
    e.coords[lo][1] + (e.coords[hi][1] - e.coords[lo][1]) * t,
    lo
  ];
}

function headingFrom(nodeId, edgeIndex){
  const e = state.edges[edgeIndex];
  let startIdx, step;
  if(e.a === nodeId && e.b !== nodeId){ startIdx = 0; step = 1; }
  else if(e.b === nodeId && e.a !== nodeId){ startIdx = e.coords.length - 1; step = -1; }
  else { startIdx = 0; step = 1; }
  const p0 = e.coords[startIdx];
  let p1 = p0;
  for(let i = startIdx + step; i >= 0 && i < e.coords.length; i += step){
    if(Math.hypot(e.coords[i][0]-p0[0], e.coords[i][1]-p0[1]) > 0.01){ p1 = e.coords[i]; break; }
  }
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  const L = Math.hypot(dx,dy) || 1;
  return { x:dx/L, y:dy/L };
}

function norm(x,y){ const L = Math.hypot(x,y) || 1; return { x:x/L, y:y/L }; }

function dirFor(edgeIndex, nodeId){
  return state.edges[edgeIndex].a === nodeId;
}

function desiredVec(){
  if(stick) return stick;
  if(keyHeld) return keyHeld;
  if(swipe && performance.now() < swipe.t) return { x:swipe.x, y:swipe.y };
  return null;
}

// Direction Pac-Man is currently travelling (used for instant U-turns).
function travelHeading(){
  const e = state.edges[state.pac.edgeIndex];
  const seg = pointAt(e, state.pac.dist)[2];
  const p0 = e.coords[seg], p1 = e.coords[seg+1] || e.coords[seg];
  let dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  if(!state.pac.forward){ dx = -dx; dy = -dy; }
  return norm(dx,dy);
}

// Direction of travel on the edge we arrived along, right at that node.
function arrivalHeadingAt(cameIndex, nodeId){
  const e = state.edges[cameIndex];
  if(e.b === nodeId){
    const n = e.coords.length;
    const a = e.coords[n-2] || e.coords[n-1], b = e.coords[n-1];
    return norm(b[0]-a[0], b[1]-a[1]);
  }
  const a = e.coords[1] || e.coords[0], b = e.coords[0];
  return norm(b[0]-a[0], b[1]-a[1]);
}

// Pick the next edge at a node. Returns null when Pac-Man must stop (wall).
function chooseAtNode(nodeId, cameIndex){
  const list = state.adjSim.get(nodeId) || [];
  const cands = (cameIndex == null) ? list : list.filter(c => c.edgeIndex !== cameIndex);
  if(!cands.length) return null;

  const arr = (cameIndex != null) ? arrivalHeadingAt(cameIndex, nodeId) : null;
  const desired = desiredVec();

  // Held direction: take whichever road is closest in angle. Ties (e.g. an exact
  // diagonal between two roads) prefer the straighter option to keep momentum.
  if(desired){
    let best = null, bestDot = -Infinity, bestAlign = -Infinity;
    for(const c of cands){
      const h = headingFrom(nodeId, c.edgeIndex);
      const dot = h.x*desired.x + h.y*desired.y;
      const align = arr ? (h.x*arr.x + h.y*arr.y) : 0;
      if(dot > bestDot + 1e-6 || (Math.abs(dot - bestDot) <= 1e-6 && align > bestAlign)){
        bestDot = dot; bestAlign = align; best = c;
      }
    }
    // Only ignore the held direction if every road here points against it.
    if(bestDot > 0) return { edgeIndex:best.edgeIndex, forward: dirFor(best.edgeIndex, nodeId) };
  }

  // No usable held direction: roll through gentle bends, otherwise stop.
  if(arr){
    let best = null, bestDot = -Infinity;
    for(const c of cands){
      const h = headingFrom(nodeId, c.edgeIndex);
      const dot = h.x*arr.x + h.y*arr.y;
      if(dot > bestDot){ bestDot = dot; best = c; }
    }
    if(bestDot >= CONTINUE_DOT) return { edgeIndex:best.edgeIndex, forward: dirFor(best.edgeIndex, nodeId) };
  }
  return null;
}

// ---------- pellets ----------
function cellKey(x,y){ return Math.floor(x/CELL)+','+Math.floor(y/CELL); }

function placePellets(){
  state.pellets = [];
  for(const e of state.edges){
    for(let d = PELLET_SPACING*0.5; d < e.length - 1; d += PELLET_SPACING){
      const p = pointAt(e, d);
      state.pellets.push({ x:p[0], y:p[1], eaten:false });
    }
  }
  state.grid = new Map();
  state.pellets.forEach((p,i) => {
    const k = cellKey(p.x,p.y);
    if(!state.grid.has(k)) state.grid.set(k, []);
    state.grid.get(k).push(i);
  });
}

function eatAround(x,y){
  const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const arr = state.grid.get((cx+i)+','+(cy+j));
    if(!arr) continue;
    for(const idx of arr){
      const p = state.pellets[idx];
      if(p.eaten) continue;
      if(Math.hypot(p.x-x, p.y-y) <= EAT_RADIUS){ p.eaten = true; state.score++; state.dirty = true; }
    }
  }
}

function spawnPac(){
  let e = null;
  for(let tries=0; tries<40 && !e; tries++){
    const c = state.edges[(Math.random()*state.edges.length)|0];
    if(c && c.length > PELLET_SPACING*3) e = c;
  }
  e = e || state.edges[0];
  const ei = state.edges.indexOf(e);
  state.pac = { edgeIndex:ei, dist: e.length*0.5, forward:true, waitNode:null };
}

function pacPos(){
  const e = state.edges[state.pac.edgeIndex];
  return pointAt(e, state.pac.dist);
}

// ---------- movement ----------
function movePac(dt){
  const pac = state.pac;
  // instant U-turn: if the player points back the way we came, flip on the spot
  if(pac.waitNode === null){
    const d = desiredVec();
    if(d){
      const h = travelHeading();
      if(h.x*d.x + h.y*d.y <= -0.6){
        // dist is measured from coords[0], so flipping direction does NOT move us
        pac.forward = !pac.forward;
        if(swipe) swipe = null;
      }
    }
  }

  let remaining = SPEED * speedFactor() * dt;
  let guard = 0;
  while(remaining > 0 && guard++ < 24){
    if(pac.waitNode !== null){
      const move = chooseAtNode(pac.waitNode, null);
      if(!move) break;
      pac.waitNode = null;
      pac.edgeIndex = move.edgeIndex;
      pac.forward = move.forward;
      pac.dist = move.forward ? 0 : state.edges[move.edgeIndex].length;
      if(swipe) swipe = null;
      continue;
    }
    const e = state.edges[pac.edgeIndex];
    const toEnd = pac.forward ? e.length - pac.dist : pac.dist;
    if(toEnd > 1e-6 && remaining < toEnd){
      pac.dist += pac.forward ? remaining : -remaining;
      remaining = 0;
    } else {
      remaining -= toEnd;
      const endNode = pac.forward ? e.b : e.a;
      pac.dist = pac.forward ? e.length : 0;
      const move = chooseAtNode(endNode, pac.edgeIndex);
      if(move){
        pac.edgeIndex = move.edgeIndex;
        pac.forward = move.forward;
        pac.dist = move.forward ? 0 : state.edges[move.edgeIndex].length;
        if(swipe) swipe = null;
      } else {
        // No road onward: if this is a boundary tunnel, reappear on the far side.
        const wrap = state.wrapMap.get(endNode);
        const exit = wrap ? pickEdgeClosestTo(wrap.node, arrivalHeadingAt(pac.edgeIndex, endNode)) : null;
        if(exit){
          pac.edgeIndex = exit.edgeIndex;
          pac.forward = exit.forward;
          pac.dist = exit.forward ? 0 : state.edges[exit.edgeIndex].length;
          if(swipe) swipe = null;
        } else {
          pac.waitNode = endNode; break;   // hit a wall: stop and wait
        }
      }
    }
  }
}

// ---------- rendering ----------
function buildRoadData(){
  return { type:'FeatureCollection', features: state.edges.map(e => ({
    type:'Feature', properties:{},
    geometry:{ type:'LineString', coordinates: e.coords.map(c => toLngLat(c[0], c[1])) }
  })) };
}

function renderPellets(force){
  if(!state.dirty) return;
  const now = performance.now();
  if(!force && now - state.lastPellet < 90) return;
  state.lastPellet = now; state.dirty = false;
  const features = [];
  for(const p of state.pellets){
    if(p.eaten) continue;
    features.push({ type:'Feature', properties:{},
      geometry:{ type:'Point', coordinates: toLngLat(p.x, p.y) } });
  }
  const src = map.getSource('pellets');
  if(src) src.setData({ type:'FeatureCollection', features });
}

function boundaryData(){
  const bb = state.bb;
  return { type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:[
    [bb.west,bb.south],[bb.east,bb.south],[bb.east,bb.north],[bb.west,bb.north],[bb.west,bb.south]
  ]}};
}

// Live dashed box on the map showing where the level will be, so the player can
// see (and aim) the play area before starting.
function previewData(){
  const bb = playBounds();
  return { type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:[
    [bb.west,bb.south],[bb.east,bb.south],[bb.east,bb.north],[bb.west,bb.north],[bb.west,bb.south]
  ]}};
}
function addPreview(){
  if(map.getSource('preview')) return;
  map.addSource('preview', { type:'geojson', data: previewData() });
  map.addLayer({ id:'preview', type:'line', source:'preview',
    paint:{ 'line-color':'#ffe14d', 'line-width':2.5, 'line-dasharray':[2,2], 'line-opacity':0.9 } });
}
function updatePreview(){
  if(state.running || state.loading) return;
  const s = map.getSource('preview');
  if(s) s.setData(previewData());
}
function setPreviewVisible(v){
  if(map.getLayer('preview')) map.setPaintProperty('preview', 'line-opacity', v ? 0.9 : 0);
}

const PORTAL_SHAPES = ['circle','diamond','triangle','square'];
const PORTAL_COLORS = ['#58e1ff','#7cff6b','#ff8ad8','#ffd23f','#b48cff','#ff7a5c'];

// Small canvas-drawn icons so each tunnel mouth gets its own shape, size and
// colour. Both ends of a tunnel share the same one, so matching is obvious.
function makePortalImage(shape, color){
  const S = 12;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S*2;
  const g = cv.getContext('2d');
  g.scale(2,2);
  const c = S/2, r = S/2 - 2;
  g.lineWidth = 1.6;
  g.lineJoin = 'round';
  g.beginPath();
  if(shape === 'circle'){ g.arc(c, c, r, 0, Math.PI*2); }
  else if(shape === 'diamond'){ g.moveTo(c, c-r); g.lineTo(c+r, c); g.lineTo(c, c+r); g.lineTo(c-r, c); g.closePath(); }
  else if(shape === 'triangle'){ g.moveTo(c, c-r); g.lineTo(c+r*0.9, c+r*0.75); g.lineTo(c-r*0.9, c+r*0.75); g.closePath(); }
  else { g.rect(c-r, c-r, 2*r, 2*r); }
  g.strokeStyle = color;
  g.fillStyle = color;
  g.globalAlpha = 0.28; g.fill();
  g.globalAlpha = 1; g.stroke();
  return g.getImageData(0, 0, S*2, S*2);
}

function nodeHash(str){
  const s = String(str);
  let h = 2166136261;
  for(let i=0; i<s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function portalData(){
  const pos = new Map();
  for(const e of state.edges){
    if(!pos.has(e.a)) pos.set(e.a, e.coords[0]);
    if(!pos.has(e.b)) pos.set(e.b, e.coords[e.coords.length-1]);
  }
  const seen = new Set(), features = [];
  for(const [id, w] of state.wrapMap){
    const other = w.node;
    const a = Math.min(id, other), b = Math.max(id, other);
    const pairKey = a + '|' + b;
    if(seen.has(pairKey)) continue;
    seen.add(pairKey);
    const h = nodeHash(pairKey);
    const shape = PORTAL_SHAPES[h % PORTAL_SHAPES.length];
    const ci = (h >>> 3) % PORTAL_COLORS.length;
    const props = { icon:'portal-'+shape+'-'+ci, scale:0.55 + ((h >>> 6) % 4) * 0.15 };
    for(const n of [a, b]){
      const xy = pos.get(n);
      if(!xy) continue;
      features.push({ type:'Feature', properties: props, geometry:{ type:'Point', coordinates: toLngLat(xy[0], xy[1]) } });
    }
  }
  return { type:'FeatureCollection', features };
}

function addLayers(){
  removeLayers();

  map.addSource('bounds', { type:'geojson', data: boundaryData() });
  map.addLayer({ id:'bounds', type:'line', source:'bounds',
    paint:{ 'line-color':'#ff5252', 'line-width':2, 'line-dasharray':[2,2], 'line-opacity':0.85 } });

  map.addSource('roads', { type:'geojson', data: buildRoadData() });
  map.addLayer({ id:'roads', type:'line', source:'roads',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color':'#ffd23f', 'line-width':3.5, 'line-opacity':0.5 } });

  PORTAL_SHAPES.forEach((s, si) => {
    PORTAL_COLORS.forEach((c, ci) => {
      const name = 'portal-'+s+'-'+ci;
      if(!(map.hasImage && map.hasImage(name))) map.addImage(name, makePortalImage(s, c));
    });
  });
  map.addSource('portals', { type:'geojson', data: portalData() });
  map.addLayer({ id:'portals', type:'symbol', source:'portals',
    layout:{ 'icon-image':['get','icon'], 'icon-size':['get','scale'],
      'icon-allow-overlap':true, 'icon-ignore-placement':true },
    paint:{ 'icon-opacity':0.9 } });

  map.addSource('pellets', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
  map.addLayer({ id:'pellets', type:'circle', source:'pellets',
    paint:{ 'circle-radius':3, 'circle-color':'#ffffff',
      'circle-stroke-color':'#000000aa', 'circle-stroke-width':0.8 } });

  state.dirty = true;
  renderPellets(true);
}

function removeLayers(){
  for(const id of ['bounds','roads','portals','pellets']){
    if(map.getLayer(id)) map.removeLayer(id);
    if(map.getSource(id)) map.removeSource(id);
  }
}

function addPacMarker(){
  const el = document.createElement('div');
  el.className = 'pac-marker';
  el.innerHTML = '<div class="pac-rot">' + characterSVG(characterById(chosenChar), false) + '</div>';
  state.rot = el.querySelector('.pac-rot');
  state.pupils = el.querySelectorAll ? Array.from(el.querySelectorAll('.pupil')) : [];
  state.marker = new maplibregl.Marker({ element: el, anchor:'center' }).setLngLat([0,0]).addTo(map);
}

function updatePacView(x, y){
  const e = state.edges[state.pac.edgeIndex];
  const seg = pointAt(e, state.pac.dist)[2];
  const p0 = e.coords[seg], p1 = e.coords[seg+1] || e.coords[seg];
  let dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  if(!state.pac.forward){ dx = -dx; dy = -dy; }
  if(state.rot){
    if(characterById(chosenChar).rotate === false){
      state.rot.style.transform = '';           // ghosts stay upright
    } else {
      const deg = Math.atan2(-dy, dx) * 180/Math.PI;
      state.rot.style.transform = 'rotate(' + deg.toFixed(1) + 'deg)';
    }
  }
  if(state.pupils && state.pupils.length){
    const len = Math.hypot(dx, dy) || 1;
    const tx = (dx/len)*0.10, ty = (-dy/len)*0.10;   // screen y is inverted
    const t = 'translate(' + tx.toFixed(3) + ',' + ty.toFixed(3) + ')';
    for(const p of state.pupils) p.setAttribute('transform', t);
  }
  state.marker.setLngLat(toLngLat(x, y));
}

function updateHud(){
  document.getElementById('score').textContent =
    'Lv ' + state.level + ' · ' + state.score + '/' + state.pellets.length;
}

// ---------- loop ----------
function frame(now){
  if(!state.running) return;
  const dt = Math.min(0.05, (now - state.last)/1000 || 0);
  state.last = now;
  movePac(dt);
  const [x,y] = pacPos();
  eatAround(x,y);
  updatePacView(x,y);
  renderPellets(false);
  updateHud();
  if(state.pellets.length && state.score >= state.pellets.length){ levelComplete(); return; }
  requestAnimationFrame(frame);
}

// ---------- game lifecycle ----------
function boundsAround(lat, lng){
  const mlat = 111320, mlon = 111320*Math.cos(lat*Math.PI/180);
  const dLat = PLAY_HALF/mlat, dLon = PLAY_HALF/mlon;
  return { south:lat-dLat, north:lat+dLat, west:lng-dLon, east:lng+dLon };
}
function playBounds(){
  const c = map.getCenter();
  return boundsAround(c.lat, c.lng);
}

// Quietly fetch the roads for wherever the map is aimed, so pressing Start is
// instant when the view hasn't moved since. Debounced to avoid hammering Overpass.
let prefetchTimer = null;
function schedulePrefetch(){
  if(state.running || state.loading) return;
  clearTimeout(prefetchTimer);
  prefetchTimer = setTimeout(() => { if(!state.running && !state.loading) fetchOverpass(playBounds()).catch(() => {}); }, 800);
}

// Lock every interactive camera gesture while playing so the view is truly fixed.
function lockCamera(){
  map.dragPan.disable();
  map.dragRotate.disable();
  map.boxZoom.disable();
  map.doubleClickZoom.disable();
  map.scrollZoom.disable();
  map.touchZoomRotate.disable();
  if(map.touchPitch) map.touchPitch.disable();
  map.keyboard.disable();
}
function unlockCamera(){
  map.dragPan.enable();
  map.boxZoom.enable();
  map.doubleClickZoom.enable();
  map.scrollZoom.enable();
  map.touchZoomRotate.enable();
  map.touchZoomRotate.disableRotation();
  map.keyboard.disable();   // arrows stay reserved for Pac-Man
}

async function startGame(){
  const status = document.getElementById('status');
  try{
    setBusy(true);
    state.loading = true;
    clearTimeout(prefetchTimer);
    const c = map.getCenter();
    proj.lng0 = c.lng; proj.lat0 = c.lat;
    proj.mlat = 111320; proj.mlon = 111320*Math.cos(proj.lat0*Math.PI/180);

    const bb = playBounds();
    state.bb = bb;
    // fixed camera: fit the whole play area once, then never scroll during play
    map.fitBounds([[bb.west, bb.south],[bb.east, bb.north]], { padding: 16, animate: false });
    lockCamera();   // freeze pan/zoom the moment Start is pressed

    status.textContent = 'Loading roads...';
    let secs = 0;
    const ticker = setInterval(() => { status.textContent = 'Loading roads... ' + (++secs) + 's'; }, 1000);
    let osm;
    try{ osm = await fetchOverpass(bb); } finally { clearInterval(ticker); }
    const g = buildGraph(osm, bb);
    state.edges = g.edges; state.adjSim = g.adjSim; state.boundary = g.boundary;
    clipDotlessEdges();
    buildWraps(bb);
    pruneShortDeadEnds(MIN_STUB);
    wrapDeadEnds();
    pruneShortDeadEnds(Infinity);   // leftover dead-ends with no partner: cut them
    keepLargestComponent();
    if(state.edges.length < 5) throw new Error('Not enough connected roads here. Move to a city block and retry.');

    state.score = 0; state.level = 1; state.pac = null;
    placePellets();
    spawnPac();
    document.getElementById('leveldone').hidden = true;

    addLayers();
    setPreviewVisible(false);
    if(state.marker) state.marker.remove();
    addPacMarker();

    state.running = true;
    document.getElementById('panel').hidden = true;
    document.getElementById('hud').hidden = false;
    document.getElementById('stick').hidden = false;
    updateHud();
    const [x,y] = pacPos();
    updatePacView(x,y);
    state.last = performance.now();
    requestAnimationFrame(frame);
  }catch(e){
    unlockCamera();
    status.textContent = e.message;
  }finally{
    state.loading = false;
    setBusy(false);
  }
}

function stopGame(){
  state.running = false;
  unlockCamera();
  setPreviewVisible(true);
  updatePreview();
  document.getElementById('panel').hidden = false;
  document.getElementById('hud').hidden = true;
  document.getElementById('stick').hidden = true;
  document.getElementById('leveldone').hidden = true;
  document.getElementById('status').textContent = 'Stopped. Start again whenever you like.';
}

// All dots eaten: freeze the game and show the level-complete card.
function levelComplete(){
  state.running = false;
  document.getElementById('stick').hidden = true;
  document.getElementById('hud').hidden = true;
  document.getElementById('ld-title').textContent = 'Level ' + state.level + ' cleared!';
  document.getElementById('ld-stats').textContent =
    state.score + ' dots eaten · next level speed ×' + (1 + state.level*SPEED_STEP > MAX_SPEED_MULT
      ? MAX_SPEED_MULT.toFixed(2) : (1 + state.level*SPEED_STEP).toFixed(2));
  document.getElementById('leveldone').hidden = false;
}

// Deal a fresh set of dots on the same streets and speed things up a notch.
function nextLevel(){
  state.level++;
  state.score = 0;
  state.pac = null;
  placePellets();
  spawnPac();
  renderPellets(true);
  document.getElementById('leveldone').hidden = true;
  document.getElementById('hud').hidden = false;
  document.getElementById('stick').hidden = false;
  updateHud();
  state.running = true;
  state.last = performance.now();
  requestAnimationFrame(frame);
}

function setBusy(on){
  document.getElementById('start').disabled = on;
  document.getElementById('start').textContent = on ? 'Loading...' : 'Start game here';
}

// ---------- geocoding ----------
async function geocode(q){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
  const j = await res.json();
  if(!j.length) throw new Error('Location not found');
  return [ parseFloat(j[0].lon), parseFloat(j[0].lat) ];
}

// ---------- input ----------
function doSwipe(v){ swipe = { x:v.x, y:v.y, t: performance.now() + 1500 }; }

function bindStick(){
  const base = document.getElementById('stick-base');
  const knob = document.getElementById('stick-knob');
  if(!base || !knob) return;
  const R = 44;                     // knob travel in px
  const DEAD = 0.16;                // ignore the very centre
  let id = null;
  const center = () => { const r = base.getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2 }; };
  const apply = e => {
    const c = center();
    const dx = e.clientX - c.x, dy = e.clientY - c.y;
    const len = Math.hypot(dx, dy) || 1;
    const travel = Math.min(len, R);
    knob.style.transform = 'translate(' + (dx/len*travel).toFixed(1) + 'px,' + (dy/len*travel).toFixed(1) + 'px)';
    if(len / R < DEAD){ stick = null; return; }
    stick = { x: dx/len, y: -dy/len };   // screen down -> world north-up
  };
  base.addEventListener('pointerdown', e => {
    e.preventDefault(); id = e.pointerId;
    try { base.setPointerCapture(id); } catch(_){}
    apply(e);
  });
  base.addEventListener('pointermove', e => { if(e.pointerId !== id) return; e.preventDefault(); apply(e); });
  const end = e => {
    if(id !== null && e.pointerId !== id) return;
    id = null; stick = null; knob.style.transform = 'translate(0,0)';
  };
  base.addEventListener('pointerup', end);
  base.addEventListener('pointercancel', end);
  base.addEventListener('lostpointercapture', end);
}

function bindControls(){
  const el = map.getContainer();
  let start = null;
  el.addEventListener('touchstart', e => {
    if(!state.running) return;
    const t = e.touches[0]; start = { x:t.clientX, y:t.clientY };
  }, { passive:true });
  el.addEventListener('touchmove', e => { if(start) e.preventDefault(); }, { passive:false });
  el.addEventListener('touchend', e => {
    if(!state.running || !start) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - start.x, dy = t.clientY - start.y;
    start = null;
    if(Math.hypot(dx,dy) < 24) return;
    doSwipe(Math.abs(dx) > Math.abs(dy) ? DRV[dx>0?'right':'left'] : DRV[dy>0?'down':'up']);
  });

  bindStick();

  const keys = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right' };
  addEventListener('keydown', e => {
    const dir = keys[e.key] || keys[e.key.toLowerCase()];
    if(dir && state.running){ e.preventDefault(); keyHeld = DRV[dir]; }
  });
  addEventListener('keyup', e => {
    const dir = keys[e.key] || keys[e.key.toLowerCase()];
    if(dir) keyHeld = null;
  });
}

// ---------- UI wiring ----------
function buildCharSelector(){
  const box = document.getElementById('chars');
  if(!box) return;
  box.innerHTML = '';
  for(const c of CHARACTERS){
    const b = document.createElement('button');
    b.className = 'char' + (c.id === chosenChar ? ' sel' : '');
    b.title = c.name;
    b.innerHTML = characterSVG(c, true) + '<span>' + c.name + '</span>';
    b.onclick = () => { chosenChar = c.id; buildCharSelector(); };
    box.appendChild(b);
  }
}

function wireUI(){
  const search = document.getElementById('search');
  const status = document.getElementById('status');
  const panel = document.getElementById('panel');
  const toggle = document.getElementById('panel-toggle');
  const collapse = () => { panel.classList.add('collapsed'); toggle.innerHTML = '&#9656;'; };
  const isPhone = () => matchMedia('(max-width:640px)').matches;

  const runSearch = async () => {
    const q = search.value.trim();
    if(!q) return;
    status.textContent = 'Searching...';
    try{
      const ll = await geocode(q);
      map.jumpTo({ center: ll, zoom: 16 });
      status.textContent = 'Found it. Aim the dashed box, then start.';
      if(isPhone()) collapse();
    }catch(e){ status.textContent = e.message; }
  };

  document.getElementById('go').onclick = runSearch;
  search.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); runSearch(); } });
  document.getElementById('loc').onclick = () => {
    if(!navigator.geolocation){ status.textContent = 'Geolocation not supported.'; return; }
    status.textContent = 'Locating...';
    navigator.geolocation.getCurrentPosition(
      p => {
        map.jumpTo({ center:[p.coords.longitude, p.coords.latitude], zoom:16 });
        status.textContent = 'Located. Aim the dashed box, then start.';
        if(isPhone()) collapse();
      },
      () => { status.textContent = 'Location unavailable (needs https or permission).'; }
    );
  };
  document.getElementById('start').onclick = startGame;
  document.getElementById('menu').onclick = stopGame;
  document.getElementById('ld-next').onclick = nextLevel;
  document.getElementById('ld-menu').onclick = stopGame;
  buildCharSelector();

  toggle.onclick = () => {
    const collapsed = panel.classList.toggle('collapsed');
    toggle.innerHTML = collapsed ? '&#9656;' : '&#9662;';
  };

  status.textContent = 'Find a city, aim the map, then start.';
}

map.on('load', () => {
  wireUI();
  bindControls();
  addPreview();
  map.on('move', updatePreview);
  map.on('moveend', schedulePrefetch);
  schedulePrefetch();
});
</script>
</body>
